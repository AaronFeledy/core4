name: drupal-stack-overrides
runtime: 4
recipe: drupal
services:
  appserver:
    type: php:8.3
    dbClient: mysql:8.0
    framework: drupal
    webroot: web
    allowOverride: true
    port: 80
    depends_on:
      - database
      - database-legacy
  database:
    type: mariadb
  database-legacy:
    type: mysql
    image: mysql:8.0
tooling:
  drush:
    service: appserver
    description: Run Drush inside the appserver service.
    wrapper: true
    cmd:
      - :drupal-local
      - drush
  composer:
    service: appserver
    description: Run Composer inside the appserver service.
    wrapper: true
    cmds:
      - composer

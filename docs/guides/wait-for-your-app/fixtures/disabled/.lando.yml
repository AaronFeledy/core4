name: wait-disabled
services:
  app:
    type: "node:22"
    primary: true
    command:
      - node
      - server.mjs
    healthcheck: curl -fsS http://localhost:3000/
    readiness: curl -fsS http://localhost:3000/ready
  native-only:
    type: "node:22"
    healthcheck: curl -fsS http://localhost:3000/health
    readiness: false

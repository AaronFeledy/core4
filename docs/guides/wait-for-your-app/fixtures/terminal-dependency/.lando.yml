name: terminal-dependency
router:
  enabled: false
services:
  db:
    type: compose
    image: docker.io/library/busybox:1.37
    appMount: false
    home: false
    command: [sh, -c, "until test -e /tmp/start-probed; do sleep 0.1; done; exit 7"]
    readiness:
      command: [sh, -c, "touch /tmp/start-probed; exit 1"]
      intervalSeconds: 5
      timeoutSeconds: 3
      retries: 40
  web:
    type: compose
    image: docker.io/library/busybox:1.37
    appMount: false
    home: false
    command: [sleep, "600"]
    depends_on:
      db:
        condition: service_healthy

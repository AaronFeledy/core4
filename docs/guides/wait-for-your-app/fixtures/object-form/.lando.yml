name: wait-object-form
services:
  timed:
    type: "node:22"
    primary: true
    command:
      - node
      - server.mjs
    readiness:
      kind: command
      command:
        - curl
        - -fsS
        - http://localhost:3000/
      intervalSeconds: 7
      timeoutSeconds: 4
      retries: 9
      startPeriodSeconds: 15
  compose:
    type: "node:22"
    port: 3001
    command:
      - node
      - server.mjs
    readiness:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:3001/
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 20s

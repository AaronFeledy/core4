name: laravel-reverb
services:
  appserver:
    type: "php:8.4"
    primary: true
    framework: laravel
    webroot: public
    composer: "2"
    allowOverride: true
    port: 80
    environment:
      APP_URL: "{{ services.appserver.url }}"
    depends_on:
      - database
      - cache
    routes:
      - hostname: "{{ app.name }}.{{ proxy.defaultDomain }}"
        scheme: both
  database:
    type: mariadb:11.4
  cache:
    type: redis
  worker:
    type: "php:8.4"
    via: cli
    command: php artisan queue:listen
    environment:
      APP_URL: "{{ services.appserver.url }}"
    depends_on:
      database:
        condition: service_healthy
  reverb:
    type: "php:8.4"
    port: 8080
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      database:
        condition: service_healthy
    routes:
      - hostname: "ws.{{ app.name }}.{{ proxy.defaultDomain }}"
    scanner:
      path: /up
  node:
    type: "node:22"
    endpoints: []
    environment:
      VITE_REVERB_URL: "{{ services.reverb.url }}"
tooling:
  artisan:
    service: appserver
    cmd: php artisan
  composer:
    service: appserver
    cmd: composer
  npm:
    service: node
    cmd: npm

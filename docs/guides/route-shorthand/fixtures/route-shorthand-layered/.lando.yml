name: route-shorthand-layered
services:
  app:
    type: "node:22"
    primary: true
    routes:
      - hostname: api.lndo.site
        pathPrefix: /v1
        filters:
          - name: strip-v1
            kind: stripPrefix
            prefix: /v1
          - kind: responseHeader
            header: X-Served-By
            value: base

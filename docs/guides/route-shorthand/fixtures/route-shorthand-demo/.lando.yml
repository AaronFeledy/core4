name: route-shorthand-demo
services:
  app:
    type: "node:22"
    port: 8080
    primary: true
    routes:
      - app.lndo.site
      - "*.app.lndo.site"
      - "*-app.lndo.site"
      - hostname: "wild.*.app.lndo.site"
        scheme: http
      - hostname: "lets.combine.*.lndo.site"
        scheme: http
        endpoint: 8080
        pathPrefix: /everything/for-real
      - hostname: api.lndo.site
        scheme: https
        endpoint: 8080
        pathPrefix: /v1
        filters:
          - name: strip-v1
            kind: stripPrefix
            prefix: /v1
          - kind: addPrefix
            prefix: /internal
          - name: trace-id
            kind: requestHeader
            header: X-Request-Source
            value: lando
          - kind: responseHeader
            header: X-Served-By
            value: lando-proxy
          - kind: redirect
            to: https://api.lndo.site/v1/docs
            permanent: false

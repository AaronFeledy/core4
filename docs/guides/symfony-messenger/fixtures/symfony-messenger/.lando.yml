name: symfony-messenger
services:
  appserver:
    type: "php:8.4"
    primary: true
    framework: symfony
    webroot: public
    composer: "2"
    allowOverride: true
    port: 80
    environment:
      DATABASE_URL: "postgresql://{{ url.encodeComponent(services.database.creds.user) }}:{{ url.encodeComponent(services.database.creds.password) }}@database:{{ services.database.port }}/{{ url.encodeComponent(services.database.creds.database) }}?serverVersion=16&charset=utf8"
      REDIS_URL: "redis://cache:6379"
    appMount:
      target: /app
      includes:
        - vendor
    dependsOn:
      - database
      - cache
    routes:
      - hostname: "{{ app.name }}.{{ proxy.defaultDomain }}"
        scheme: both
  database:
    type: "postgres:16"
  cache:
    type: redis
  worker:
    type: "php:8.4"
    via: cli
    framework: symfony
    command: "php bin/console messenger:consume async --time-limit=3600 -vv"
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://{{ url.encodeComponent(services.database.creds.user) }}:{{ url.encodeComponent(services.database.creds.password) }}@database:{{ services.database.port }}/{{ url.encodeComponent(services.database.creds.database) }}?serverVersion=16&charset=utf8"
    appMount:
      target: /app
      includes:
        - vendor
    dependsOn:
      database:
        condition: service_healthy
tooling:
  composer:
    cmds:
      - composer
    description: "Run Composer inside the appserver service."
    service: appserver
  console:
    cmds:
      - "php bin/console"
    description: "Run the Symfony console inside the appserver service."
    service: appserver

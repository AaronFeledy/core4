name: php-command-resolution-demo
services:
  appserver:
    type: "php:8.3"
    primary: true
tooling:
  composer:
    service: appserver
    cmd: composer
  phpunit:
    service: appserver
    cmd: [":php-local", "phpunit"]
    wrapper: true
  console:
    service: appserver
    cmd: [":php-local", "bin/console"]
    wrapper: true

name: compose-resource-limits
provider: docker
services:
  worker:
    type: compose
    image: alpine:3.20
    appMount: false
    command: sleep infinity
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
          pids: 200
        reservations:
          memory: 256m
  ollama:
    type: compose
    image: ollama/ollama
    appMount: false
    gpus: all

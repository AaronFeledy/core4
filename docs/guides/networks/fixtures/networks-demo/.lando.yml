name: networks-demo
networks:
  backend: {}
  shared:
    name: mailstack_default
    external: true
services:
  web:
    type: compose
    image: traefik/whoami:v1.10
    networks:
      backend: {}
      shared:
        aliases: [api]
  cache:
    type: compose
    image: valkey/valkey:8-alpine
    networks: [backend]

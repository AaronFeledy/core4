name: drupal-theme-infer
services:
  appserver:
    type: "php:8.4"
    primary: true
    framework: drupal
    webroot: web
    composer: "2"
    allowOverride: true
    port: 80
  node:
    type: node
    packageRoot: web/themes/contrib/bootstrap5
    primary: false
    endpoints: []
tooling:
  npm:
    service: node
    dir: /app/web/themes/contrib/bootstrap5
    description: Run npm inside the theme.
    cmds:
      - npm

name: fastapi-demo
runtime: 4
services:
  cache:
    type: redis
  database:
    type: postgres
  web:
    type: python:3.12
    port: 8000
    framework: fastapi
    routes:
      - hostname: "{{ app.name }}.{{ proxy.defaultDomain }}"
        scheme: both
    depends_on:
      - database
      - cache
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --reload]
    environment:
      DATABASE_URL: "postgresql://{{ services.database.creds.user }}:{{ services.database.creds.password }}@database:5432/{{ services.database.creds.database }}"
      REDIS_URL: redis://cache:6379/0
tooling:
  pip:
    service: web
    description: Run pip inside the web service.
    wrapper: true
    cmds:
      - pip
  uvicorn:
    service: web
    description: Run uvicorn inside the web service.
    wrapper: true
    cmds:
      - uvicorn

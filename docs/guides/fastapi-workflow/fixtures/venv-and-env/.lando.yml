name: fastapi-demo
runtime: 4
services:
  cache:
    type: redis
  database:
    type: postgres
  web:
    type: python:3.12
    port: 8000
    framework: fastapi
    routes:
      - hostname: "{{ app.name }}.{{ proxy.defaultDomain }}"
        scheme: both
    dependsOn:
      - database
      - cache
    entrypoint:
      - sh
      - -c
      - '([ -x /app/.venv/bin/pip ] || /usr/local/bin/python -m venv /app/.venv) && exec "$@"'
      - --
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --reload]
    environment:
      VIRTUAL_ENV: /app/.venv
      PATH: /app/.venv/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
      DATABASE_URL: "postgresql://{{ services.database.creds.user }}:{{ services.database.creds.password }}@database:5432/{{ services.database.creds.database }}"
      REDIS_URL: redis://cache:6379/0
tooling:
  pip:
    service: web
    description: Run pip inside the web service.
    cmds:
      - pip
  uvicorn:
    service: web
    description: Run uvicorn inside the web service.
    cmds:
      - uvicorn

name: scripts-demo
services:
  web:
    type: static
    webroot: dist
tooling:
  curl:
    service: web
    cmd:
      - sh
      - -c
      - 'curl -sf "http://localhost:80/$1"'
      - curl
  smoke:
    description: Fetch a path from the running site and fail loudly
    service: ":host"
    args:
      path:
        order: 0
        required: true
        description: Path to fetch, such as version.txt
    cmd: [curl, -sf, "{{ services.web.url }}/{{ args.path }}"]

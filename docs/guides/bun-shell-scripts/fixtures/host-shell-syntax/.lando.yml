name: host-shell-demo
tooling:
  notify-posix:
    description: Written for sh, which Bun Shell runs differently
    service: ":host"
    env:
      CHANNEL: deploys
    cmd: 'echo "posting to $${CHANNEL}" >&2'
  notify:
    description: The same command in Bun Shell syntax
    service: ":host"
    env:
      CHANNEL: deploys
    cmd: 'echo "posting to $CHANNEL" 1>&2'

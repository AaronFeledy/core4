name: host-shell-demo
tooling:
  notify-posix:
    description: Written for sh, which Bun Shell runs differently
    service: ":host"
    env:
      CHANNEL: deploys
    cmd: 'echo "posting to $${CHANNEL}" >&2'
  notify:
    description: The same command in Bun Shell syntax
    service: ":host"
    env:
      CHANNEL: deploys
    cmd: 'echo "posting to $CHANNEL" 1>&2'
  seed-posix:
    description: A loop written for sh
    service: ":host"
    cmd: "for name in one two; do echo seeding $name; done"
  seed:
    description: The same loop as a Bun program
    service: ":host"
    cmd: bun ./scripts/seed.ts

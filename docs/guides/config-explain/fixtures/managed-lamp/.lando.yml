name: explain-demo
recipe:
  id: lamp
  options:
    composer: "2"
    database: mariadb:11.4
    name: explain-demo
    php: "8.2"
    webroot: /app
  producer:
    contentDigest: sha256:8296b2b6dad5128b2f6eea6eb489e1c45cdf19e26695800ad2e3aea7747a2989
    manifestVersion: 0.1.0
    packageName: "@lando/recipe-lamp"
    recipeId: lamp
    sourceKind: bundled
  version: 0.1.0
runtime: 4
services:
  appserver:
    composer: "{{ recipe.composer }}"
    dependsOn:
      - database
    framework: none
    port: 80
    type: "php:{{ recipe.php }}"
    webroot: /app
  database:
    type: "{{ recipe.database }}"
tooling:
  composer:
    cmds:
      - composer
    description: "Run Composer inside the appserver service."
    service: appserver
  php:
    cmds:
      - php
    description: "Run the PHP CLI inside the appserver service."
    service: appserver
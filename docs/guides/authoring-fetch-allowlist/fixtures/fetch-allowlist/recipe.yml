id: fetch-allowlist
title: Fetch allowlist
description: Recipe that may fetch from one API host.
version: 0.1.0
config:
  runtime: 4
  services:
    api:
      type: lando
      image: busybox:1.37
      command: sleep infinity
fetchAllowlist:
  - https://api.example.com/**
  - https://registry.lando.dev/recipes/*

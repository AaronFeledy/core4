name: tanstack-start-demo
services:
  web:
    type: "node:22"
    primary: true
    port: 3000
    command: [npm, run, dev]
    environment:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: "web.{{ app.name }}.{{ proxy.defaultDomain }}"
      DATABASE_URL: "postgresql://{{ services.database.creds.user }}:{{ services.database.creds.password }}@database:5432/{{ services.database.creds.database }}"
    depends_on:
      database:
        condition: service_healthy
  database:
    type: "postgres:18"
tooling:
  npm:
    cmd: [npm]
    description: Run npm in /app inside the web service.
    wrapper: true
    service: web
    dir: /app
  npx:
    cmd: [npx]
    description: Run npx inside the web service.
    service: web
    dir: /app
  dev:
    cmd: [npm, run, dev]
    description: Run the dev script with the published hostname allowed in Vite.
    service: web
    dir: /app
    env:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: "{{ url.parse(services.web.url).hostname }}"

name: migrate-demo
recipe:
  id: lamp
  options:
    composer: "2"
    database: mariadb:11.4
    name: migrate-demo
    php: "8.2"
    webroot: /app
  producer:
    contentDigest: sha256:d5ea6255c0dad0ba58f063079c6cf7f35999bf351e397419b978b895b887f150
    manifestVersion: 0.1.0
    packageName: "@lando/recipe-lamp"
    recipeId: lamp
    sourceKind: bundled
  version: 0.1.0
runtime: 4
services:
  appserver:
    composer: "{{ recipe.composer }}"
    dependsOn:
      - database
    framework: none
    port: 80
    type: "php:{{ recipe.php }}"
    webroot: /app
  database:
    type: "{{ recipe.database }}"
tooling:
  composer:
    cmds:
      - composer
    description: "Run Composer inside the appserver service."
    service: appserver
  php:
    cmds:
      - php
    description: "Run the PHP CLI inside the appserver service."
    service: appserver

name: migrate-demo
recipe:
  id: lamp
  options:
    composer: "2"
    database: mariadb:11.4
    name: migrate-demo
    php: "8.2"
    webroot: .
  producer:
    contentDigest: sha256:82c9c3a5c8f8ae44b1be5bd8a68ddfc0bdda51833a8f50ecd7660e6457cb6406
    manifestVersion: 0.1.0
    packageName: "@lando/recipe-lamp"
    recipeId: lamp
    sourceKind: bundled
  version: 0.1.0
runtime: 4
services:
  appserver:
    composer: "{{ recipe.composer }}"
    dependsOn:
      - database
    framework: none
    port: 80
    type: "php:{{ recipe.php }}"
    webroot: .
  database:
    type: "{{ recipe.database }}"
tooling:
  composer:
    cmds:
      - composer
    description: "Run Composer inside the appserver service."
    service: appserver
  php:
    cmds:
      - php
    description: "Run the PHP CLI inside the appserver service."
    service: appserver

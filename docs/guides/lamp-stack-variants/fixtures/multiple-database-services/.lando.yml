name: lamp-stack-variants
runtime: 4
recipe: lamp
services:
  appserver:
    type: php:8.3
    framework: none
    port: 80
    dependsOn:
      - database
      - database-legacy
  database:
    type: mariadb
  database-legacy:
    type: mysql
    image: mysql:8.0
tooling:
  composer:
    service: appserver
    description: Run Composer inside the appserver service.
    cmds:
      - composer
  php:
    service: appserver
    description: Run the PHP CLI inside the appserver service.
    cmds:
      - php

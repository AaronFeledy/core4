name: lamp-stack-variants
runtime: 4
recipe: lamp
services:
  appserver:
    type: php:8.3
    framework: none
    port: 80
    volumes:
      - ./config/custom-php.ini:/usr/local/etc/php/conf.d/zzz-custom.ini:ro
    dependsOn:
      - database
  database:
    type: mariadb
    volumes:
      - ./config/custom-mariadb.cnf:/etc/mysql/conf.d/zzz-custom.cnf:ro
tooling:
  composer:
    service: appserver
    description: Run Composer inside the appserver service.
    cmds:
      - composer
  php:
    service: appserver
    description: Run the PHP CLI inside the appserver service.
    cmds:
      - php

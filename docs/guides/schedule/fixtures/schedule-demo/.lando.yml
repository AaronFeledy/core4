name: schedule-demo
services:
  appserver:
    type: "node:22"
    primary: true
    environment:
      TZ: "America/Chicago"
    schedule:
      - name: heartbeat
        every: "@every 5m"
        run: "echo heartbeat from $(hostname)"
      - name: report
        every: "0 6 * * 1-5"
        run: ["node", "--version"]

name: wordpress-vite
services:
  appserver:
    type: "php:8.4"
    primary: true
    framework: wordpress
    port: 80
    dependsOn:
      - database
    routes:
      - hostname: "{{ app.name }}.{{ proxy.defaultDomain }}"
        scheme: both
  database:
    type: mariadb
  node:
    type: "node:22"
    port: 5173
    primary: false
    routes:
      - hostname: "vite.{{ app.name }}.{{ proxy.defaultDomain }}"
        scheme: both
tooling:
  composer:
    cmds:
      - composer
    description: "Run Composer inside the appserver service."
    service: appserver
  wp:
    cmds:
      - wp
    description: "Run WP-CLI inside the appserver service."
    service: appserver
  npm:
    cmds:
      - npm
    description: "Run npm inside the node service."
    service: node

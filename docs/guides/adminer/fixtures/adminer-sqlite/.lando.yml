name: adminer-sqlite
services:
  appserver:
    type: "php:8.3"
    primary: true
    sqlite:
      path: data/site.sqlite
  adminer:
    type: compose
    image: adminer:5
    volumes:
      - ./login-password-less.php:/var/www/html/plugins-enabled/login-password-less.php
    endpoints:
      - _tag: internal
        name: ui
        protocol: http
        port: 8080

name: adminer-sqlite
services:
  appserver:
    type: "php:8.3"
    primary: true
    sqlite:
      path: data/site.sqlite
  adminer:
    type: compose
    image: adminer:6
    volumes:
      - ./adminer-password.php:/var/www/html/plugins-enabled/adminer-password.php
    endpoints:
      - _tag: internal
        name: ui
        protocol: http
        port: 8080

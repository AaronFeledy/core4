name: adminer-mariadb
services:
  db:
    type: mariadb
  adminer:
    type: compose
    image: adminer:5
    appMount: false
    environment:
      ADMINER_DEFAULT_SERVER: db
    endpoints:
      - _tag: internal
        name: ui
        protocol: http
        port: 8080
    dependsOn:
      db:
        condition: service_healthy

id: lamp-child
title: Lamp Child
description: Extends lamp with a narrower PHP choice and one extra file.
version: 0.1.0
extends: lamp
options:
  php:
    type:
      kind: enum
      values:
        - "8.2"
        - "8.3"
    default: "8.2"
    prompt:
      message: PHP version
config:
  services:
    appserver:
      webroot: web
files:
  - src: extra.txt
    dest: extra.txt
postInit:
  - type: message
    text: Run lando start inside the new app directory.

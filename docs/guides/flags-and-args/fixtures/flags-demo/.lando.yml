name: flags-and-args-demo
runtime: 4
services:
  web:
    type: node:lts
    primary: true
  worker:
    type: node:lts
tooling:
  retired-shorthand: false
  greet:
    description: Greet a target environment
    service: ":host"
    flags:
      name:
        alias: n
        description: Who to greet
        default: world
      loud:
        boolean: true
        description: Shout the greeting
    args:
      target:
        order: 0
        required: true
        choices: [dev, prod]
        description: Environment to greet
    cmd: echo "hello {{ default(flags.loud, false) ? upper(flags.name) : flags.name }} from {{ args.target }} via {{ task.canonicalId }}"
  deploy:
    description: Run against a chosen service
    flags:
      service:
        alias: s
        description: Service to run in
        choices: [web, worker]
        default: web
    service: ":service"
    cmd: echo deploying
  tag:
    description: Tag a release
    service: web
    args:
      label:
        order: 0
        description: Release label
      channel:
        order: 1
        default: stable
        description: Release channel
    cmd: echo tagging
  legacy:
    description: Retired task
    disabled: true
    service: web
    cmd: echo legacy
  retired-shorthand: false
  pkg-version:
    description: Print the version from package.json
    service: ":host"
    vars:
      VERSION:
        sh: bun -p "require('./package.json').version"
    cmd: echo "version {{ vars.VERSION }}"
  tagged:
    description: Print the tag stored in VERSION
    service: ":host"
    vars:
      TAG:
        sh: cat VERSION
    cmd: echo "tag {{ vars.TAG }}"
  literal:
    description: Show that a computed value is data, not shell
    service: ":host"
    vars:
      TEXT:
        sh: printf '%s' 'a$(echo PWNED)b'
    cmd: echo "[{{ vars.TEXT }}]"

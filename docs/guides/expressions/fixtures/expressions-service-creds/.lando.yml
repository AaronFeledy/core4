name: Creds Demo
services:
  web:
    type: "node:22"
    primary: true
    environment:
      DATABASE_URL: "postgresql://{{ services.database.creds.user }}:{{ url.encodeComponent(services.database.creds.password) }}@database:{{ services.database.port }}/{{ services.database.creds.database }}"
      DB_LABEL: "{{ app.name }}:{{ services.database.creds.user }}"
  database:
    type: "postgres:16"
    port: 5433

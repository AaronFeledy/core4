name: expressions-url-tooling-live
services:
  web:
    type: nginx
    primary: true
    routes:
      - hostname: expressions-url-tooling.lndo.site
        scheme: both
tooling:
  site-url:
    service: web
    description: Print the address the router publishes for web.
    cmd: [echo, "{{ services.web.url }}"]
  site-host:
    service: web
    description: Print the hostname part of the published address.
    cmd: [echo, "{{ url.parse(services.web.url).hostname }}"]
events:
  post-start:
    - service: web
      cmd: "echo {{ services.web.url }} > /tmp/published-url"

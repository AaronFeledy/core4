# lando-lint: expect-invalid tooling reads service.url and a URL in a placement field
name: url-tooling-refused
services:
  web:
    type: nginx
    primary: true
tooling:
  self:
    service: web
    cmd: "echo {{ service.url }}"
  placed:
    service: web
    dir: "{{ services.web.url }}"
    cmd: pwd
  placed-var:
    service: web
    vars:
      site: "{{ services.web.url }}"
    dir: "{{ vars.site }}"
    cmd: pwd

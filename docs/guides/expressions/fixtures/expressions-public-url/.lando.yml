name: public-url
services:
  web:
    type: "node:22"
    primary: true
    port: 3000
    environment:
      APP_URL: "{{ services.web.url }}"
      APP_HOST: "{{ service.hostname }}"
      APP_ORIGIN: "{{ service.origin }}"
      APP_PORT: "{{ service.publicPort }}"
      APP_SCHEME: "{{ service.scheme }}"
proxy:
  web:
    - public-url.lndo.site:3000

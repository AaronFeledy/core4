name: bound-password-helper
services:
  web:
    type: "node:22"
    primary: true
    environment:
      DB_PASSWORD_UPPER: "{{ upper(services.database.creds.password) }}"
  database:
    type: "postgres:16"
    creds:
      user: lando
      database: bound-password-helper
      password: '${secret:DB_PASSWORD}'

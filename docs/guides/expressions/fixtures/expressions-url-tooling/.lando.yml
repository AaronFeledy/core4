name: url-tooling
services:
  web:
    type: nginx
    primary: true
    # This lint-only fixture does not serve files from the checkout.
    appMount: false
    webroot: /usr/share/nginx/html
    routes:
      - hostname: url-tooling.lndo.site
        scheme: both
tooling:
  smoke:
    service: ":host"
    description: Fetch the home page through the proxy.
    cmd: "curl -fsSk {{ services.web.url }}/"
  site-url:
    service: web
    description: Print the address the router publishes for web.
    env:
      SITE_URL: "{{ services.web.url }}"
    cmd: printenv SITE_URL
  site-host:
    service: web
    description: Print the hostname the router publishes for web.
    cmd: [echo, "{{ services.web.hostname }}"]
  site-origin:
    service: web
    description: Print the scheme, hostname, and port without a path.
    cmd: [echo, "{{ services.web.origin }}"]
  site-port:
    service: web
    description: Print the router port a browser dials for web.
    cmd: [echo, "{{ services.web.publicPort }}"]
  site-scheme:
    service: web
    description: Print http or https for web's route.
    cmd: [echo, "{{ services.web.scheme }}"]
  site-address:
    service: web
    description: Print web's URL, then the router port on its own.
    cmd: [echo, "{{ services.web.url }}", "{{ services.web.publicPort }}"]
events:
  post-start:
    - service: web
      cmd: "echo Site is up at {{ services.web.url }}"

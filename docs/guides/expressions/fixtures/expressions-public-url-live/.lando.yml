name: expressions-public-url-live
services:
  web:
    type: nginx
    primary: true
    routes:
      - hostname: expressions-public-url.lndo.site
        scheme: both
    environment:
      APP_URL: "{{ services.web.url }}"
      APP_HOST: "{{ service.hostname }}"
      APP_ORIGIN: "{{ service.origin }}"
      APP_PORT: "{{ service.publicPort }}"
      APP_SCHEME: "{{ service.scheme }}"

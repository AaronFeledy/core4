name: wp-network
services:
  appserver:
    type: "php:8.4"
    primary: true
    framework: wordpress
    port: 80
    allowOverride: true
    dependsOn:
      - database
    routes:
      - hostname: "{{ app.name }}.{{ proxy.defaultDomain }}"
        scheme: both
      - hostname: "*.{{ app.name }}.{{ proxy.defaultDomain }}"
        scheme: both
  database:
    type: mariadb
tooling:
  composer:
    cmds:
      - composer
    description: "Run Composer inside the appserver service."
    service: appserver
  wp:
    cmds:
      - wp
    description: "Run WP-CLI inside the appserver service."
    service: appserver

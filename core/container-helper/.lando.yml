name: lando-container-helper
runtime: 4
# The builder serves nothing, so it needs no router (and works on hosts that can't run one, like CI).
router:
  enabled: false
services:
  builder:
    type: compose
    image: golang:1.23.12-alpine@sha256:383395b794dffa5b53012a212365d40c8e37109a626ca30d6151c8348d380b5f
    home: false
    command: sleep infinity
    # Bind the default-excluded folders through instead of shadowing them with app-named
    # volumes, so several checkouts (git worktrees) can build the helper side by side.
    appMount:
      target: /app
      includes: [node_modules, vendor, tmp]
    environment:
      CGO_ENABLED: "0"
      GOCACHE: /app/.cache/go-build
      GOFLAGS: -mod=mod
      GOTOOLCHAIN: local

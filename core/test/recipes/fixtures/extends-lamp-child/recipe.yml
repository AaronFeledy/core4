id: extends-lamp-child
title: Lamp Child
description: Extends lamp, overrides one option, and adds a file plus postInit.
version: 0.2.0
extends: lamp
config:
options:
  php:
    type:
      kind: enum
      values:
        - "8.2"
        - "8.3"
    default: "8.2"
    prompt:
      message: PHP version
files:
  - src: extra.txt
    dest: extra.txt
postInit:
  - type: gitInit

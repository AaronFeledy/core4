id: extends-lamp-child
title: Lamp Child
description: Extends lamp, overrides one prompt, and adds a file plus postInit.
version: 0.2.0
extends: lamp
prompts:
  - name: php
    type: select
    message: PHP version
    default: "8.2"
    choices:
      - value: "8.2"
      - value: "8.3"
files:
  - src: extra.txt
    dest: extra.txt
postInit:
  - type: gitInit

# Every `bun` command run from the repo root refuses preserved symlinks before loading workspace code.
preload = ["./scripts/preserve-symlinks-preload.ts"]

[install]
linker = "hoisted"

[test]
preload = [
  "./scripts/require-derived-codegen-preload.ts",
  "./scripts/preserve-symlinks-preload.ts",
  "./scripts/test-preload.ts",
]
include = [
  "core/test/**/*.test.ts",
  "engine/test/**/*.test.ts",
  "paths/test/**/*.test.ts",
  "state-store/test/**/*.test.ts",
  "redaction/test/**/*.test.ts",
  "http-client/test/**/*.test.ts",
  "managed-file/test/**/*.test.ts",
  "landofile/test/**/*.test.ts",
  "container-runtime/test/**/*.test.ts",
  "sdk/test/**/*.test.ts",
  "plugins/*/test/**/*.test.ts",
  "docs/test/**/*.test.ts",
]
pathIgnorePatterns = [
  "dist/**",
  "core/dist/**",
  "provider-diagnostics/**",
]

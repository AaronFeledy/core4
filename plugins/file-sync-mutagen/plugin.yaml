# @lando/file-sync-mutagen — Mutagen-backed FileSyncEngine.

name: "@lando/file-sync-mutagen"
version: "0.0.0"
api: 4
description: "Mutagen-backed FileSyncEngine for accelerated bind mounts on slow-bind-mount providers."
enabled: true
updateable: true
entry: ./src/index.ts

contributes:
  fileSyncEngines:
    - id: mutagen
      supports:
        platform: [win32]
      capabilities:
        modes: [two-way-safe, two-way-resolved, one-way-safe, one-way-replica]
        remoteAgentDeployment: auto
        exclusionPatterns: true
        conflictReporting: true
        progressReporting: true
      defaultFor:
        platform: [win32]
        bindMountPerformance: [slow]

requires:
  "@lando/core": "^4.0.0"

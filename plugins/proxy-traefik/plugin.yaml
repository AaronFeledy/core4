# @lando/proxy-traefik — Traefik-backed RouterService.

name: "@lando/proxy-traefik"
version: "0.0.0"
api: 4
description: "Traefik-backed RouterService implementation contributing routerServices."
enabled: true
updateable: true

provides:
  routerServices:
    - id: traefik
      module: ./src/proxy.ts
      defaultFor:
        platform: [darwin, linux, win32]
  globalServices:
    - id: traefik
      module: ./src/global-services/traefik.ts
      enabledByDefault: true
      requires:
        providerCapabilities: [sharedCrossAppNetwork]

requires:
  "@lando/core": "^4.0.0"

name: "@lando/service-lando"
version: "0.0.0"
api: 4
description: "The opinionated `lando` service base."
enabled: true
updateable: true
entry: ./src/index.ts

contributes:
  serviceTypes:
    - "apache"
    - "compose"
    - "dotnet"
    - "dotnet:8.0"
    - "dotnet:9.0"
    - "elasticsearch"
    - "elasticsearch:8"
    - "go:1.22"
    - "go:1.23"
    - "lando"
    - "localstack"
    - "mailhog"
    - "mailpit"
    - "mariadb"
    - "meilisearch"
    - "meilisearch:1"
    - "memcached"
    - "minio"
    - "mongodb"
    - "mssql"
    - "mssql:2019"
    - "mssql:2022"
    - "mysql"
    - "nginx"
    - "node:lts"
    - "node:22"
    - "opensearch"
    - "opensearch:2"
    - "php:8.1"
    - "php:8.2"
    - "php:8.3"
    - "php:8.4"
    - "phpmyadmin"
    - "phpmyadmin:5"
    - "phpmyadmin:latest"
    - "postgres"
    - "python:3.12"
    - "rabbitmq"
    - "rabbitmq:3"
    - "rabbitmq:4"
    - "redis"
    - "ruby:3.3"
    - "solr"
    - "solr:9"
    - "static"
    - "static:nginx"
    - "static:caddy"
    - "tomcat"
    - "tomcat:9"
    - "tomcat:10"
    - "tomcat:11"
    - "valkey"
    - "varnish"
    - "varnish:6"
    - "varnish:7"
  serviceFeatures:
    - "lando.boot"
    - "lando.user-id"
    - "lando.storage"
    - "lando.env"
    - "lando.app-mount"
    - "lando.healthcheck"
    - "lando.certs"
    - "lando.security"
    - "lando.user"
    - "service-lando.apache"
    - "service-lando.compose"
    - "service-lando.dotnet"
    - "service-lando.elasticsearch"
    - "service-lando.go"
    - "service-lando.lando"
    - "service-lando.localstack"
    - "service-lando.mailhog"
    - "service-lando.mailpit"
    - "service-lando.mariadb"
    - "service-lando.meilisearch"
    - "service-lando.memcached"
    - "service-lando.minio"
    - "service-lando.mongodb"
    - "service-lando.mssql"
    - "service-lando.mysql"
    - "service-lando.nginx"
    - "service-lando.node"
    - "service-lando.opensearch"
    - "service-lando.php"
    - "service-lando.phpmyadmin"
    - "service-lando.postgres"
    - "service-lando.python"
    - "service-lando.rabbitmq"
    - "service-lando.redis"
    - "service-lando.ruby"
    - "service-lando.solr"
    - "service-lando.static"
    - "service-lando.tomcat"
    - "service-lando.valkey"
    - "service-lando.varnish"
  appFeatures:
    - "service-lando.phpmyadmin.wire"

requires:
  "@lando/core": "^4.0.0"

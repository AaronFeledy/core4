name: "@lando/sql"
version: "0.0.0"
api: 4
description: "Bundled database import, export, snapshot, restore, and reset commands."
enabled: true
entry: ./src/index.ts

contributes:
  commands:
    - db:import
    - db:export
    - db:snapshot
    - db:snapshots
    - db:snapshots:prune
    - db:restore
    - db:reset
    - db:seed

requires:
  "@lando/core": "^4.0.0"

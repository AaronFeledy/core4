# Generated by scripts/codegen.ts — do not hand-edit. Edit scripts/build-rails-journey-workflow.ts instead.
name: rails-journey

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  container-helper:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Isolate Lando roots
        shell: bash
        run: |
          echo "LANDO_USER_CONF_ROOT=$RUNNER_TEMP/lando-conf" >> "$GITHUB_ENV"
          echo "LANDO_USER_DATA_ROOT=$RUNNER_TEMP/lando-data" >> "$GITHUB_ENV"
          echo "LANDO_USER_CACHE_ROOT=$RUNNER_TEMP/lando-cache" >> "$GITHUB_ENV"
          echo "LANDO_SYSTEM_PLUGIN_ROOT=$RUNNER_TEMP/lando-system-plugins" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate derived sources
        run: bun run codegen

      # The builder publishes no routes, so the job skips router setup.
      - name: Set up Lando with Docker
        run: bun core/bin/lando.ts setup --yes --provider=docker --skip-proxy --skip-install-ca --skip-shell-integration --skip-file-sync

      - name: Build and test the container helper with Lando
        run: |
          bun run scripts/build-container-helper.ts --test
          bun test core/test/container-helper/helper.integration.test.ts

      - name: Upload container helper
        uses: actions/upload-artifact@v6
        with:
          name: container-helper
          path: core/container-helper/dist/
          if-no-files-found: error
          retention-days: 14
  rails-journey-linux-x64:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [container-helper]
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Isolate Lando roots
        shell: bash
        run: |
          echo "LANDO_USER_CONF_ROOT=$RUNNER_TEMP/lando-conf" >> "$GITHUB_ENV"
          echo "LANDO_USER_DATA_ROOT=$RUNNER_TEMP/lando-data" >> "$GITHUB_ENV"
          echo "LANDO_USER_CACHE_ROOT=$RUNNER_TEMP/lando-cache" >> "$GITHUB_ENV"
          echo "LANDO_SYSTEM_PLUGIN_ROOT=$RUNNER_TEMP/lando-system-plugins" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate derived sources
        run: bun run codegen

      - name: Download container helper
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-helper
          path: core/container-helper/dist

      - name: Restore container helper permissions
        shell: bash
        run: chmod +x core/container-helper/dist/linux-*/lando-container-helper

      - name: Build command registry manifest
        run: bun run --filter='@lando/core' build:manifest

      - name: Build linux-x64 binary
        run: |
          mkdir -p dist
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "0.0.0-dev")
          bun run scripts/build-compiled-binary.ts --target bun-linux-x64 --outfile ./dist/lando --version "$VERSION" --minify --sourcemap=external
      - name: Assemble current-commit linux-x64 runtime bundle
        run: bun run scripts/assemble-runtime-bundle.ts --platform linux-x64

      - name: Build local runtime bundle manifest
        run: |
          RUNTIME_VERSION="$(bun -e 'import { readRuntimeBundleSources } from "./scripts/runtime-bundle-sources.ts"; process.stdout.write((await readRuntimeBundleSources()).runtimeVersion)')"
          MANIFEST="$(bun run scripts/build-runtime-bundle.ts --local --platform linux-x64 --runtime-version "$RUNTIME_VERSION")"
          echo "LANDO_RUNTIME_BUNDLE_MANIFEST=$MANIFEST" >> "$GITHUB_ENV"

      - name: Provision rootless runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y uidmap fuse-overlayfs
          if ! grep -q "^$(id -un):" /etc/subuid; then
            echo "$(id -un):100000:65536" | sudo tee -a /etc/subuid
          fi
          if ! grep -q "^$(id -un):" /etc/subgid; then
            echo "$(id -un):100000:65536" | sudo tee -a /etc/subgid
          fi
          sudo sysctl net.ipv4.ip_unprivileged_port_start=0
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if ! grep -q "systemd.unified_cgroup_hierarchy" /proc/cmdline; then
            echo "::notice title=ci-runtime::cgroups v2 unified hierarchy assumed via Ubuntu LTS default (systemd.unified_cgroup_hierarchy)"
          fi
          sudo mkdir -p /sys/fs/cgroup/user.slice/user-$(id -u).slice
          sudo chown -R "$(id -un)" "/sys/fs/cgroup/user.slice/user-$(id -u).slice" || true

      - name: Configure rootless overlay storage
        run: |
          cat > "${{ runner.temp }}/lando-storage.conf" <<EOF
          [storage]
          driver = "overlay"

          [storage.options.overlay]
          mount_program = "${{ runner.temp }}/lando-data/runtime/bin/fuse-overlayfs"
          EOF
          echo "CONTAINERS_STORAGE_CONF=${{ runner.temp }}/lando-storage.conf" >> "$GITHUB_ENV"

      - name: Setup provider
        run: |
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          mkdir -p "$XDG_RUNTIME_DIR"
          dist/lando setup --yes --provider=lando --skip-install-ca --skip-shell-integration --skip-file-sync

      - name: Run Rails journey
        run: bun run scripts/rails-journey.ts --binary dist/lando --app-dir ${{ runner.temp }}/rails-app --report ${{ runner.temp }}/rails-journey.json

      - name: Teardown
        if: always()
        run: |
          BINARY="$GITHUB_WORKSPACE/dist/lando"
          (cd "${{ runner.temp }}/rails-app/rails-journey" && "$BINARY" destroy -y) || true
          "$BINARY" poweroff || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rails-journey-linux-x64
          path: ${{ runner.temp }}/rails-journey.json
          if-no-files-found: ignore

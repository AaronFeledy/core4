# Generated by scripts/codegen.ts — do not hand-edit. Edit scripts/build-workflow-performance-workflow.ts instead.
name: workflow-performance

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      start_samples:
        description: Start-class samples per lane
        default: '5'
        type: string
      heavy_samples:
        description: Heavy samples per lane
        default: '3'
        type: string
      failing_fixture_lane:
        description: Controlled failure proof (empty, mysql-import, or postgres-import)
        default: ''
        type: string

defaults:
  run:
    shell: bash

permissions:
  actions: read
  contents: read

jobs:
  workflow-performance-linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate derived sources
        run: bun run codegen

      - name: Build command registry manifest
        run: bun run --filter='@lando/core' build:manifest

      - name: Build linux-x64 binary
        run: |
          mkdir -p dist
          bun run --filter='@lando/core' build:host-proxy-shim
          bun run --filter='@lando/core' build:log-file-helper
          bun -e "const fs = await import('node:fs/promises'); await fs.cp('core/dist/host-proxy', 'dist/host-proxy', { recursive: true }); await fs.cp('core/dist/log-file-access', 'dist/log-file-access', { recursive: true });"
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "0.0.0-dev")
          bun run scripts/build-compiled-binary.ts --target bun-linux-x64 --outfile ./dist/lando --version "$VERSION" --minify --sourcemap=external

      - name: Setup Go for Linux Podman source build
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.25.6

      - name: Setup Rust for Linux helper source builds
        uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0

      - name: Install Linux Podman source-build prerequisites
        run: |
          set -euo pipefail
          UBUNTU_SNAPSHOT=20260902T000000Z
          printf 'APT::Snapshot "%s";\n' "$UBUNTU_SNAPSHOT" | sudo tee /etc/apt/apt.conf.d/50lando-runtime-bundle-snapshot
          sudo apt-get update
          PACKAGES=(build-essential libbtrfs-dev libcap-dev libdevmapper-dev libglib2.0-dev libseccomp-dev libsqlite3-dev libsystemd-dev patch pkg-config protobuf-compiler uidmap)
          sudo apt-get install -y --no-install-recommends --allow-downgrades --reinstall "${PACKAGES[@]}"
          for PACKAGE in "${PACKAGES[@]}"; do
            INSTALLED_VERSION="$(dpkg-query -W -f='${Version}' "$PACKAGE")"
            POLICY="$(apt-cache policy "$PACKAGE")"
            CANDIDATE_VERSION="$(awk '/Candidate:/ { print $2 }' <<< "$POLICY")"
            test "$INSTALLED_VERSION" = "$CANDIDATE_VERSION"
            if ! awk -v candidate="$CANDIDATE_VERSION" -v snapshot="https://snapshot.ubuntu.com/ubuntu/$UBUNTU_SNAPSHOT" '
              $1 == "***" && $2 == candidate { candidate_block = 1; next }
              candidate_block && $1 ~ /^[0-9]+$/ { if ($2 == snapshot) found = 1; next }
              candidate_block { candidate_block = 0 }
              END { exit found ? 0 : 1 }
            ' <<< "$POLICY"; then
              echo "::error title=runtime-bundle-apt-snapshot::$PACKAGE candidate $CANDIDATE_VERSION did not resolve from Ubuntu snapshot $UBUNTU_SNAPSHOT"
              exit 1
            fi
          done

      - name: Assemble current-commit linux-x64 runtime bundle
        run: bun run scripts/assemble-runtime-bundle.ts --platform linux-x64

      - name: Build local runtime bundle manifest
        run: |
          RUNTIME_VERSION="$(bun -e 'import { readRuntimeBundleSources } from "./scripts/runtime-bundle-sources.ts"; process.stdout.write((await readRuntimeBundleSources()).runtimeVersion)')"
          MANIFEST="$(bun run scripts/build-runtime-bundle.ts --local --platform linux-x64 --runtime-version "$RUNTIME_VERSION")"
          echo "LANDO_RUNTIME_BUNDLE_MANIFEST=$MANIFEST" >> "$GITHUB_ENV"
          echo "WORKFLOW_PERF_RUNTIME_VERSION=$RUNTIME_VERSION" >> "$GITHUB_ENV"

      - name: Provision rootless runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y uidmap fuse-overlayfs
          if ! grep -q "^$(id -un):" /etc/subuid; then
            echo "$(id -un):100000:65536" | sudo tee -a /etc/subuid
          fi
          if ! grep -q "^$(id -un):" /etc/subgid; then
            echo "$(id -un):100000:65536" | sudo tee -a /etc/subgid
          fi
          sudo sysctl net.ipv4.ip_unprivileged_port_start=0
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if ! grep -q "systemd.unified_cgroup_hierarchy" /proc/cmdline; then
            echo "::notice title=ci-runtime::cgroups v2 unified hierarchy assumed via Ubuntu LTS default (systemd.unified_cgroup_hierarchy)"
          fi
          sudo mkdir -p /sys/fs/cgroup/user.slice/user-$(id -u).slice
          sudo chown -R "$(id -un)" "/sys/fs/cgroup/user.slice/user-$(id -u).slice" || true

      - name: Run workflow performance samples
        id: performance
        env:
          START_SAMPLES: ${{ inputs.start_samples || '5' }}
          HEAVY_SAMPLES: ${{ inputs.heavy_samples || '3' }}
          FAILING_FIXTURE_LANE: ${{ inputs.failing_fixture_lane || '' }}
          WORKFLOW_PERF_ISOLATION: "1"
        run: |
          set +e
          ROOT="$RUNNER_TEMP/workflow-performance-linux-x64"
          mkdir -p "$ROOT"
          BINARY_VERSION="$(dist/lando --version)"
          PROVIDER_VERSION="$(bun -e 'const value = await Bun.file("plugins/provider-lando/package.json").json(); process.stdout.write(String(value.version))')"
          bun run scripts/workflow-performance.ts \
            --binary "$GITHUB_WORKSPACE/dist/lando" \
            --report "$ROOT/report.json" \
            --root-dir "$ROOT/work" \
            --run-id "${{ github.run_id }}.linux-x64" \
            --run-attempt "${{ github.run_attempt }}" \
            --commit "${{ github.sha }}" \
            --platform "linux-x64" \
            --architecture "x64" \
            --runner "ubuntu-24.04" \
            --binary-version "$BINARY_VERSION" \
            --runtime-version "$WORKFLOW_PERF_RUNTIME_VERSION" \
            --provider-version "$PROVIDER_VERSION" \
            --fixture-seed "workflow-performance-v1" \
            --start-samples "$START_SAMPLES" \
            --heavy-samples "$HEAVY_SAMPLES" \
            --failing-fixture-lane "$FAILING_FIXTURE_LANE"
          echo "$?" > "$ROOT/exit-code"
          exit 0

      - name: Download compatible performance history candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ROOT="$RUNNER_TEMP/workflow-performance-linux-x64"
          mkdir -p "$ROOT/history"
          gh api "/repos/${{ github.repository }}/actions/workflows/workflow-performance.yml/runs?status=completed&per_page=30" \
            --jq '.workflow_runs[] | [.id, .created_at, .conclusion] | @tsv' > "$ROOT/history-index.tsv"
          while IFS=$'	' read -r run_id _created _conclusion; do
            test -n "$run_id" || continue
            mkdir -p "$ROOT/history/$run_id"
            gh run download "$run_id" --name "workflow-performance-linux-x64" --dir "$ROOT/history/$run_id" || true
          done < "$ROOT/history-index.tsv"

      - name: Render last-30-run trend
        if: always()
        run: |
          ROOT="$RUNNER_TEMP/workflow-performance-linux-x64"
          bun run scripts/workflow-performance-history-cli.ts \
            --current "$ROOT/report.json" \
            --index "$ROOT/history-index.tsv" \
            --artifact-root "$ROOT/history" \
            --summary "$ROOT/history-summary.json" \
            --markdown "$ROOT/history-summary.md"

      - name: Upload workflow performance report and trend
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: workflow-performance-linux-x64
          path: |
            ${{ runner.temp }}/workflow-performance-linux-x64/report.json
            ${{ runner.temp }}/workflow-performance-linux-x64/history-summary.json
            ${{ runner.temp }}/workflow-performance-linux-x64/history-summary.md
          if-no-files-found: error
          retention-days: 90

      - name: Enforce workflow correctness
        if: always()
        run: |
          ROOT="$RUNNER_TEMP/workflow-performance-linux-x64"
          test -f "$ROOT/exit-code"
          exit "$(cat "$ROOT/exit-code")"

      - name: Ownership-scoped cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/workflow-performance-linux-x64"


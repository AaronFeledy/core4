  provider-lando-e2e-linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate derived sources
        run: bun run codegen

      - name: Install Podman 6 toolchain (Homebrew; Ubuntu/OBS lack Podman 6)
        run: |
          sudo apt-get update
          sudo apt-get install -y uidmap fuse-overlayfs
          if ! command -v brew >/dev/null 2>&1; then
            test -x /home/linuxbrew/.linuxbrew/bin/brew
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew update
          brew install podman
          BREW_PREFIX="$(brew --prefix)"
          echo "$BREW_PREFIX/bin" >> "$GITHUB_PATH"
          echo "LANDO_CI_PODMAN_HELPER_DIR=$BREW_PREFIX/opt/podman/libexec/podman" >> "$GITHUB_ENV"
          # The OCI runtime and monitor are separate Homebrew formulae that Homebrew does
          # not link onto PATH, so a bundle-staging step that searches PATH would copy
          # the runner's preinstalled (older) crun/conmon and Podman 6 would reject their
          # OCI config version. Export the Podman 6 toolchain directories so staging can
          # prefer them over the system copies.
          toolchain_dirs="$BREW_PREFIX/opt/podman/libexec/podman:$BREW_PREFIX/bin"
          for dep in crun conmon fuse-overlayfs; do
            dep_prefix="$(brew --prefix "$dep" 2>/dev/null || true)"
            if test -n "$dep_prefix" && test -d "$dep_prefix/bin"; then
              toolchain_dirs="$dep_prefix/bin:$toolchain_dirs"
            fi
          done
          echo "LANDO_CI_PODMAN_TOOLCHAIN_DIRS=$toolchain_dirs" >> "$GITHUB_ENV"
          # The managed runtime resolves its OCI runtime from the default system search
          # list (/usr/bin/crun first), not from the bundle or helper_binaries_dir, so a
          # runner's preinstalled crun that predates Podman 6 makes container start fail
          # with "crun: unknown version specified". Overwrite the default-path crun with
          # the Podman 6 toolchain build (its interpreter/RPATH stay absolute to the
          # Homebrew prefix, which persists on the runner).
          crun_prefix="$(brew --prefix crun 2>/dev/null || true)"
          if test -n "$crun_prefix" && test -x "$crun_prefix/bin/crun"; then
            sudo install -m 0755 "$crun_prefix/bin/crun" /usr/bin/crun
          fi
          # User-level container configs override any system files wholesale, so seed
          # them instead of mutating /etc: a distro-era /etc/containers/registries.conf
          # can be v1-format TOML, and appending v2 keys to it makes every podman
          # engine load fail with "registries.conf must be in v2 format but is in v1".
          mkdir -p "$HOME/.config/containers"
          if ! test -f "$HOME/.config/containers/registries.conf"; then
            printf 'unqualified-search-registries = ["docker.io"]\n' > "$HOME/.config/containers/registries.conf"
          fi
          if ! test -f "$HOME/.config/containers/policy.json" && ! test -f /etc/containers/policy.json; then
            printf '{"default":[{"type":"insecureAcceptAnything"}]}\n' > "$HOME/.config/containers/policy.json"
          fi
          # The runner image's system-level container config is outside our control and
          # changes between image releases. Pin the cgroup manager at user level so this
          # lane remains deterministic.
          if ! test -f "$HOME/.config/containers/containers.conf"; then
            if test -d /run/systemd/system; then
              printf '[engine]\ncgroup_manager = "systemd"\n' > "$HOME/.config/containers/containers.conf"
            else
              printf '[engine]\ncgroup_manager = "cgroupfs"\n' > "$HOME/.config/containers/containers.conf"
            fi
          fi
          # A system-level storage.conf left behind by a distro podman install pins the
          # rootful runroot/graphroot, which Podman 6 honors literally for rootless
          # users. Seed a rootless-safe user-level storage.conf so the default service
          # always resolves user paths.
          if ! test -f "$HOME/.config/containers/storage.conf"; then
            printf '[storage]\ndriver = "overlay"\nrunroot = "%s"\ngraphroot = "%s"\n' \
              "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/containers" \
              "$HOME/.local/share/containers/storage" > "$HOME/.config/containers/storage.conf"
          fi
          podman --version

      - name: Assert Podman 6 host contract
        run: |
          MINIMUM="6.0.0"
          version_output="$(podman --version 2>/dev/null || true)"
          numbers="$(printf '%s\n' "$version_output" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          remediation="Install Podman >= $MINIMUM (Homebrew formula: podman) before Podman-backed CI runs."
          if test -z "$numbers"; then
            echo "::error title=podman6-contract::Could not parse a Podman version from '${version_output:-<no podman on PATH>}'. $remediation"
            exit 1
          fi
          major="${numbers%%.*}"
          minor_patch="${numbers#*.}"
          minor="${minor_patch%%.*}"
          patch="${minor_patch#*.}"
          floor_major="${MINIMUM%%.*}"
          floor_minor_patch="${MINIMUM#*.}"
          floor_minor="${floor_minor_patch%%.*}"
          floor_patch="${floor_minor_patch#*.}"
          meets=yes
          if test "$major" -lt "$floor_major"; then
            meets=no
          elif test "$major" -eq "$floor_major"; then
            if test "$minor" -lt "$floor_minor"; then
              meets=no
            elif test "$minor" -eq "$floor_minor" && test "$patch" -lt "$floor_patch"; then
              meets=no
            fi
          fi
          if test "$meets" = no; then
            echo "::error title=podman6-contract::Podman $numbers (from '$version_output') does not satisfy the >= $MINIMUM host contract. $remediation"
            exit 1
          fi
          echo "podman6-contract: $numbers satisfies >= $MINIMUM"

      - name: Enable unprivileged port binding
        run: sudo sysctl net.ipv4.ip_unprivileged_port_start=0

      - name: Start Podman socket
        run: |
          podman system service --time=0 unix:///tmp/podman.sock > /tmp/podman-service.log 2>&1 &
          echo "$!" > /tmp/podman-service.pid
          for i in {1..30}; do test -S /tmp/podman.sock && exit 0; sleep 1; done
          cat /tmp/podman-service.log
          exit 1

      - name: Build Linux x64 binary
        run: |
          bun run --filter='@lando/core' build:manifest
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "0.0.0-dev")
          bun run scripts/build-compiled-binary.ts --target bun-linux-x64 --outfile ./core/dist/lando --version "$VERSION" --minify --sourcemap=external
          bun run scripts/sanitize-compiled-binary.ts ./core/dist/lando
          ./core/dist/lando --version

      - name: Run e2e guide scenarios
        run: |
          LANDO_SCENARIO_E2E_BINARY="$GITHUB_WORKSPACE/core/dist/lando" bun run scripts/test-reporters/run-guide-scenarios.ts test/scenarios/generated/guides/** --max-concurrency=1 --test-name-pattern="\[e2e\]"
        env:
          LANDO_GUIDE_E2E: "1"
          LANDO_GUIDE_SCENARIO_LIVE_OUTPUT: "1"
          LANDO_TEST_PODMAN_SOCKET: /tmp/podman.sock
          LANDO_CONFIG__default_provider_id: lando

      - name: Run live integration suites
        run: |
          bun test core/test/live
        env:
          LANDO_TEST_PODMAN_SOCKET: /tmp/podman.sock
          LANDO_CONFIG__default_provider_id: lando

      - name: Teardown Podman
        if: always()
        run: |
          podman ps -aq --filter "name=lando-" | xargs -r podman rm -f || true
          podman network ls --format '{{.Name}}' | grep '^lando-' | xargs -r podman network rm || true
          if test -f /tmp/podman-service.pid; then kill "$(cat /tmp/podman-service.pid)" || true; fi
          rm -f /tmp/podman.sock /tmp/podman-service.pid

      - name: Collect provider-lando e2e diagnostics
        if: failure()
        run: |
          mkdir -p provider-lando-e2e-diagnostics
          cp /tmp/podman-service.log provider-lando-e2e-diagnostics/podman-service.log || true
          cp -r dist/transcripts/guides provider-lando-e2e-diagnostics/guide-transcripts || true
          journalctl --no-pager --since "-30 minutes" > provider-lando-e2e-diagnostics/journalctl.log 2>&1 || true

      - name: Upload provider-lando e2e diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: provider-lando-e2e-diagnostics-linux-x64
          path: provider-lando-e2e-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  published-manifest-setup-linux-x64:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Provision rootless runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y uidmap fuse-overlayfs
          if ! grep -q "^$(id -un):" /etc/subuid; then
            echo "$(id -un):100000:65536" | sudo tee -a /etc/subuid
          fi
          if ! grep -q "^$(id -un):" /etc/subgid; then
            echo "$(id -un):100000:65536" | sudo tee -a /etc/subgid
          fi
          sudo sysctl net.ipv4.ip_unprivileged_port_start=0
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if ! grep -q "systemd.unified_cgroup_hierarchy" /proc/cmdline; then
            echo "::notice title=ci-runtime::cgroups v2 unified hierarchy assumed via Ubuntu LTS default (systemd.unified_cgroup_hierarchy)"
          fi
          sudo mkdir -p /sys/fs/cgroup/user.slice/user-$(id -u).slice
          sudo chown -R "$(id -un)" "/sys/fs/cgroup/user.slice/user-$(id -u).slice" || true

      - name: Build Linux x64 binary
        run: |
          mkdir -p dist/cache/runtime-bundle
          bun run --filter='@lando/core' build:manifest
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "0.0.0-dev")
          bun run scripts/build-compiled-binary.ts --target bun-linux-x64 --outfile ./dist/lando --version "$VERSION" --minify --sourcemap=external
          bun run scripts/sanitize-compiled-binary.ts ./dist/lando
          ./dist/lando --version

      - name: Configure rootless overlay storage
        run: |
          cat > dist/cache/runtime-bundle/storage.conf <<EOF
          [storage]
          driver = "overlay"

          [storage.options.overlay]
          mount_program = "$HOME/.local/share/lando/runtime/bin/fuse-overlayfs"
          EOF
          echo "CONTAINERS_STORAGE_CONF=$GITHUB_WORKSPACE/dist/cache/runtime-bundle/storage.conf" >> "$GITHUB_ENV"

      - name: Seed rootless containers user config
        run: |
          mkdir -p "$HOME/.config/containers"
          if ! test -f "$HOME/.config/containers/registries.conf"; then
            printf 'unqualified-search-registries = ["docker.io"]\n' > "$HOME/.config/containers/registries.conf"
          fi
          if ! test -f "$HOME/.config/containers/policy.json" && ! test -f /etc/containers/policy.json; then
            printf '{"default":[{"type":"insecureAcceptAnything"}]}\n' > "$HOME/.config/containers/policy.json"
          fi

      - name: Prepare provider via lando setup against the published manifest
        run: |
          test -z "${LANDO_RUNTIME_BUNDLE_MANIFEST:-}"
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          mkdir -p "$XDG_RUNTIME_DIR"
          dist/lando setup --yes --provider=lando --skip-install-ca --skip-shell-integration --skip-file-sync

      - name: Verify the published bundle downloaded, verified, and installed
        run: |
          for _ in {1..30}; do
            test -S "$HOME/.local/share/lando/runtime/run/podman.sock" && break
            sleep 1
          done
          test -S "$HOME/.local/share/lando/runtime/run/podman.sock"
          test -x "$HOME/.local/share/lando/runtime/bin/podman"
          if ldd "$HOME/.local/share/lando/runtime/bin/podman" | grep -E 'libgpgme|libassuan|not found'; then
            echo "::error title=runtime-bundle-portability::managed podman has non-portable or missing shared libraries"
            ldd "$HOME/.local/share/lando/runtime/bin/podman" || true
            exit 1
          fi

      - name: Teardown Lando runtime
        if: always()
        run: |
          dist/lando poweroff || true
          LANDO_PODMAN="$HOME/.local/share/lando/runtime/bin/podman"
          LANDO_PODMAN_ARGS=(--root "$HOME/.local/share/lando/runtime/storage" --runroot "$HOME/.local/share/lando/runtime/run" --config "$HOME/.local/share/lando/runtime/config")
          "$LANDO_PODMAN" "${LANDO_PODMAN_ARGS[@]}" ps -aq --filter "name=lando-" | xargs -r "$LANDO_PODMAN" "${LANDO_PODMAN_ARGS[@]}" rm -f || true
          "$LANDO_PODMAN" "${LANDO_PODMAN_ARGS[@]}" network ls --format '{{.Name}}' | grep '^lando-' | xargs -r "$LANDO_PODMAN" "${LANDO_PODMAN_ARGS[@]}" network rm || true

  mysql-arm-client-linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Provision rootless runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y uidmap fuse-overlayfs
          if ! grep -q "^$(id -un):" /etc/subuid; then
            echo "$(id -un):100000:65536" | sudo tee -a /etc/subuid
          fi
          if ! grep -q "^$(id -un):" /etc/subgid; then
            echo "$(id -un):100000:65536" | sudo tee -a /etc/subgid
          fi
          sudo sysctl net.ipv4.ip_unprivileged_port_start=0
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if ! grep -q "systemd.unified_cgroup_hierarchy" /proc/cmdline; then
            echo "::notice title=ci-runtime::cgroups v2 unified hierarchy assumed via Ubuntu LTS default (systemd.unified_cgroup_hierarchy)"
          fi
          sudo mkdir -p /sys/fs/cgroup/user.slice/user-$(id -u).slice
          sudo chown -R "$(id -un)" "/sys/fs/cgroup/user.slice/user-$(id -u).slice" || true

      - name: Setup Go for Linux Podman source build
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: 1.25.6

      - name: Setup Rust for Linux helper source builds
        uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4

      - name: Install Linux Podman source-build prerequisites
        run: |
          set -euo pipefail
          UBUNTU_SNAPSHOT=20260922T000000Z
          printf 'APT::Snapshot "%s";\n' "$UBUNTU_SNAPSHOT" | sudo tee /etc/apt/apt.conf.d/50lando-runtime-bundle-snapshot
          sudo apt-get update
          PACKAGES=(build-essential libbtrfs-dev libcap-dev libdevmapper-dev libglib2.0-dev libseccomp-dev libsqlite3-dev libsystemd-dev patch pkg-config protobuf-compiler uidmap)
          sudo apt-get install -y --no-install-recommends --allow-downgrades --reinstall "${PACKAGES[@]}"
          for PACKAGE in "${PACKAGES[@]}"; do
            INSTALLED_VERSION="$(dpkg-query -W -f='${Version}' "$PACKAGE")"
            POLICY="$(apt-cache policy "$PACKAGE")"
            CANDIDATE_VERSION="$(awk '/Candidate:/ { print $2 }' <<< "$POLICY")"
            test "$INSTALLED_VERSION" = "$CANDIDATE_VERSION"
            if ! awk -v candidate="$CANDIDATE_VERSION" -v snapshot="https://snapshot.ubuntu.com/ubuntu/$UBUNTU_SNAPSHOT" '
              $1 == "***" && $2 == candidate { candidate_block = 1; next }
              candidate_block && $1 ~ /^[0-9]+$/ { if ($2 == snapshot) found = 1; next }
              candidate_block { candidate_block = 0 }
              END { exit found ? 0 : 1 }
            ' <<< "$POLICY"; then
              echo "::error title=runtime-bundle-apt-snapshot::$PACKAGE candidate $CANDIDATE_VERSION did not resolve from Ubuntu snapshot $UBUNTU_SNAPSHOT"
              exit 1
            fi
          done

      - name: Assemble current-commit linux-arm64 runtime bundle
        run: bun run scripts/assemble-runtime-bundle.ts --platform linux-arm64

      - name: Report current-commit ARM runtime bundle fingerprints
        run: |
          BUNDLE=dist/cache/runtime-bundle/lando-runtime-linux-arm64.tar.gz
          test -f "$BUNDLE"
          SHA="$(sha256sum "$BUNDLE" | awk '{print $1}')"
          SIZE="$(wc -c < "$BUNDLE" | tr -d ' ')"
          echo "linux-arm64 sha256=$SHA size=$SIZE"
          echo "::notice title=runtime-bundle-candidate::linux-arm64 sha256=$SHA size=$SIZE"

      - name: Upload current-commit linux-arm64 runtime bundle
        uses: actions/upload-artifact@v6
        with:
          name: runtime-bundle-linux-arm64-current
          path: dist/cache/runtime-bundle/lando-runtime-linux-arm64.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Build local runtime bundle manifest
        run: |
          test -f dist/cache/runtime-bundle/lando-runtime-linux-arm64.tar.gz
          RUNTIME_VERSION="$(bun -e 'import { readRuntimeBundleSources } from "./scripts/runtime-bundle-sources.ts"; process.stdout.write((await readRuntimeBundleSources()).runtimeVersion)')"
          MANIFEST="$(bun run scripts/build-runtime-bundle.ts --local --platform linux-arm64 --runtime-version "$RUNTIME_VERSION")"
          test -n "$MANIFEST"
          echo "LANDO_RUNTIME_BUNDLE_MANIFEST=$MANIFEST" >> "$GITHUB_ENV"
          echo "::notice title=runtime-bundle-candidate-manifest::$MANIFEST"

      - name: Regenerate derived sources
        run: bun run codegen

      - name: Build Linux arm64 binary
        run: |
          mkdir -p dist
          bun run --filter='@lando/core' build:manifest
          bun run --filter='@lando/core' build:log-file-helper
          bun -e "const fs = await import('node:fs/promises'); await fs.cp('core/dist/log-file-access', 'dist/log-file-access', { recursive: true });"
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "0.0.0-dev")
          bun run scripts/build-compiled-binary.ts --target bun-linux-arm64 --outfile ./dist/lando --version "$VERSION" --minify --sourcemap=external
          bun run scripts/sanitize-compiled-binary.ts ./dist/lando
          ./dist/lando --version
          test "$(uname -m)" = aarch64

      - name: Isolate Lando roots
        run: |
          echo "LANDO_USER_CONF_ROOT=$RUNNER_TEMP/lando-conf" >> "$GITHUB_ENV"
          echo "LANDO_USER_DATA_ROOT=$RUNNER_TEMP/lando-data" >> "$GITHUB_ENV"
          echo "LANDO_USER_CACHE_ROOT=$RUNNER_TEMP/lando-cache" >> "$GITHUB_ENV"

      - name: Configure rootless overlay storage
        run: |
          cat > "$RUNNER_TEMP/lando-storage.conf" <<EOF
          [storage]
          driver = "overlay"

          [storage.options.overlay]
          mount_program = "$RUNNER_TEMP/lando-data/runtime/bin/fuse-overlayfs"
          EOF
          echo "CONTAINERS_STORAGE_CONF=$RUNNER_TEMP/lando-storage.conf" >> "$GITHUB_ENV"

      - name: Seed rootless containers user config
        run: |
          mkdir -p "$HOME/.config/containers"
          if ! test -f "$HOME/.config/containers/registries.conf"; then
            printf 'unqualified-search-registries = ["docker.io"]\n' > "$HOME/.config/containers/registries.conf"
          fi
          if ! test -f "$HOME/.config/containers/policy.json" && ! test -f /etc/containers/policy.json; then
            printf '{"default":[{"type":"insecureAcceptAnything"}]}\n' > "$HOME/.config/containers/policy.json"
          fi

      - name: Prepare provider via lando setup against the current-commit manifest
        run: |
          test -n "${LANDO_RUNTIME_BUNDLE_MANIFEST:-}"
          test -z "${LANDO_RUNTIME_BUNDLE_URL:-}"
          test -z "${LANDO_RUNTIME_BUNDLE_SHA256:-}"
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          mkdir -p "$XDG_RUNTIME_DIR"
          dist/lando setup --yes --provider=lando --skip-install-ca --skip-shell-integration --skip-file-sync

      - name: Verify the current-commit bundle downloaded, verified, and installed
        run: |
          for _ in {1..30}; do
            test -S "$LANDO_USER_DATA_ROOT/runtime/run/podman.sock" && break
            sleep 1
          done
          test -S "$LANDO_USER_DATA_ROOT/runtime/run/podman.sock"
          test -x "$LANDO_USER_DATA_ROOT/runtime/bin/podman"
          if ldd "$LANDO_USER_DATA_ROOT/runtime/bin/podman" | grep -E 'libgpgme|libassuan|not found'; then
            echo "::error title=runtime-bundle-portability::managed podman has non-portable or missing shared libraries"
            ldd "$LANDO_USER_DATA_ROOT/runtime/bin/podman" || true
            exit 1
          fi

      - name: Wrap managed Podman for ARM MySQL client tests
        run: |
          wrapper="$RUNNER_TEMP/lando-managed-podman"
          printf '%s\n' '#!/bin/sh' 'set -eu'             "export CONTAINERS_CONF=\"$LANDO_USER_DATA_ROOT/runtime/config/containers.conf\""             "exec \"$LANDO_USER_DATA_ROOT/runtime/bin/podman\" --root \"$LANDO_USER_DATA_ROOT/runtime/storage\" --runroot \"$LANDO_USER_DATA_ROOT/runtime/run\" --config \"$LANDO_USER_DATA_ROOT/runtime/config\" \"\$@\""             > "$wrapper"
          chmod 0755 "$wrapper"
          case "$wrapper" in /*) ;; *) echo "wrapper must be absolute" >&2; exit 1 ;; esac
          test -x "$wrapper"
          "$wrapper" --version
          echo "LANDO_TEST_MYSQL_ARM64_PODMAN=$wrapper" >> "$GITHUB_ENV"

      - name: Run native ARM MySQL client tests
        run: bun test plugins/service-lando/test/mysql-arm-client.integration.test.ts
        env:
          LANDO_CONFIG__default_provider_id: lando

      - name: Teardown managed Lando runtime
        if: always()
        run: |
          dist/lando poweroff || true
          LANDO_PODMAN="$LANDO_USER_DATA_ROOT/runtime/bin/podman"
          LANDO_PODMAN_ARGS=(--root "$LANDO_USER_DATA_ROOT/runtime/storage" --runroot "$LANDO_USER_DATA_ROOT/runtime/run" --config "$LANDO_USER_DATA_ROOT/runtime/config")
          if test -x "$LANDO_PODMAN"; then
            "$LANDO_PODMAN" "${LANDO_PODMAN_ARGS[@]}" ps -aq --filter "name=lando-mysql-arm-" | xargs -r "$LANDO_PODMAN" "${LANDO_PODMAN_ARGS[@]}" rm -f || true
            "$LANDO_PODMAN" "${LANDO_PODMAN_ARGS[@]}" network ls --format '{{.Name}}' | grep '^lando-mysql-arm-' | xargs -r "$LANDO_PODMAN" "${LANDO_PODMAN_ARGS[@]}" network rm || true
          fi

      - name: Collect ARM MySQL client diagnostics
        if: failure()
        run: |
          mkdir -p mysql-arm-client-diagnostics
          if test -f "$LANDO_USER_DATA_ROOT/runtime/run/service.log"; then
            cp "$LANDO_USER_DATA_ROOT/runtime/run/service.log" mysql-arm-client-diagnostics/lando-managed-service.log || true
          fi
          if test -d "$LANDO_USER_CACHE_ROOT/logs"; then
            cp -r "$LANDO_USER_CACHE_ROOT/logs" mysql-arm-client-diagnostics/lando-logs || true
          fi
          journalctl --no-pager --since "-30 minutes" > mysql-arm-client-diagnostics/journalctl.log 2>&1 || true

      - name: Upload ARM MySQL client diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mysql-arm-client-diagnostics-linux-arm64
          path: mysql-arm-client-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  nightly-tier-unit-tests-linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run nightly-tier unit tests
        run: bun test core/test/scripts/codegen-ci.test.ts core/test/build/linux-acceptance-criteria-10-14.test.ts

  refresh-test-timings-linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate derived sources
        run: bun run codegen

      - name: Refresh unit-test timings
        run: bun run scripts/update-test-timings.ts

      - name: Upload refreshed timings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bun-test-timings
          path: .bun-test-timings.json
          if-no-files-found: error
          retention-days: 14

  runtime-bundle-manifest-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify committed runtime-bundle manifest resolves live
        run: bun run check:runtime-bundle-manifest --live

  distribution-rehearsal-linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build command registry manifest
        run: bun run --filter='@lando/core' build:manifest

      - name: Compile all platform binaries
        run: |
          mkdir -p dist/bundle
          bun run --filter='@lando/core' build:log-file-helper
          bun -e "const fs = await import('node:fs/promises'); await fs.cp('core/dist/log-file-access', 'dist/bundle/log-file-access', { recursive: true });"
          bun install --frozen-lockfile --os="*" --cpu="*"
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "0.0.0-dev")
          bun run scripts/build-compiled-binary.ts --target bun-darwin-arm64 --outfile ./dist/bundle/lando-darwin-arm64 --version "$VERSION" --minify --sourcemap=external
          bun run scripts/build-compiled-binary.ts --target bun-darwin-x64 --outfile ./dist/bundle/lando-darwin-x64 --version "$VERSION" --minify --sourcemap=external
          bun run scripts/build-compiled-binary.ts --target bun-linux-arm64 --outfile ./dist/bundle/lando-linux-arm64 --version "$VERSION" --minify --sourcemap=external
          bun run scripts/build-compiled-binary.ts --target bun-linux-x64 --outfile ./dist/bundle/lando-linux-x64 --version "$VERSION" --minify --sourcemap=external
          bun run scripts/build-compiled-binary.ts --target bun-windows-x64 --outfile ./dist/bundle/lando-windows-x64.exe --version "$VERSION" --minify --sourcemap=external
          bun run scripts/build-compiled-binary.ts --target bun-windows-arm64 --outfile ./dist/bundle/lando-windows-arm64.exe --version "$VERSION" --minify --sourcemap=external
          bun run scripts/sanitize-compiled-binary.ts ./dist/bundle/lando-darwin-arm64
          bun run scripts/sanitize-compiled-binary.ts ./dist/bundle/lando-darwin-x64
          bun run scripts/sanitize-compiled-binary.ts ./dist/bundle/lando-linux-arm64
          bun run scripts/sanitize-compiled-binary.ts ./dist/bundle/lando-linux-x64
          bun run scripts/sanitize-compiled-binary.ts ./dist/bundle/lando-windows-x64.exe
          bun run scripts/sanitize-compiled-binary.ts ./dist/bundle/lando-windows-arm64.exe
          ./dist/bundle/lando-linux-x64 --version

      - name: Package distribution bundle
        run: bun run scripts/dist-bundle.ts dist/bundle

      - name: Verify SHA256SUMS match the binaries
        run: bun run scripts/dist-bundle.ts --verify dist/bundle

      - name: Upload distribution rehearsal bundle
        uses: actions/upload-artifact@v6
        with:
          name: lando-dist-rehearsal-v4.0.0-nightly.${{ github.run_number }}
          path: dist/bundle
          if-no-files-found: error
          retention-days: 14

# Generated by scripts/codegen.ts — do not hand-edit. Edit scripts/build-release-workflow.ts instead.
#
# Scope: dev prerelease only. This workflow does not produce a signed release; it republishes the
# ci-built linux-x64 binary as a v4.0.0-dev.N GitHub prerelease and publishes npm dev-tag packages.
# The full signed release pipeline (scripts/release.ts) is invoked manually, not by this workflow.
# Runbook: docs/contributing/release.md.
name: release

on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  dev-prerelease-linux-x64:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .bun-version

      - name: Verify committed runtime-bundle manifest resolves live
        run: bun run check:runtime-bundle-manifest --live

      - name: Download Linux x64 binary artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ github.event.workflow_run.id }}" --name lando-linux-x64 --dir dist

      - name: Restore binary executable bit
        run: chmod +x dist/lando

      - name: Install first-launch sandbox tools
        run: |
          sudo apt-get update
          sudo apt-get install -y strace iproute2

      - name: Sandboxed first launch has no non-loopback network calls
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lando-conf" "$RUNNER_TEMP/lando-data" "$RUNNER_TEMP/lando-cache"
          sudo env LANDO_USER_CONF_ROOT="$RUNNER_TEMP/lando-conf" LANDO_USER_DATA_ROOT="$RUNNER_TEMP/lando-data" LANDO_USER_CACHE_ROOT="$RUNNER_TEMP/lando-cache" unshare --net bash -c '
            set -euo pipefail
            ip link set lo up
            strace -f -e trace=network -o dist/first-launch.network.log ./dist/lando --version
          '
          awk '/connect\(/ && $0 !~ /(127\.|::1|AF_UNIX)/ { bad = 1 } END { exit bad }' dist/first-launch.network.log

      - name: Write SHA256SUMS
        run: |
          cd dist
          sha256sum lando > SHA256SUMS
          grep -Eq '^[0-9a-f]{64}  lando$' SHA256SUMS

      - name: Publish dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v4.0.0-dev.${{ github.run_number }}
        run: |
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_TAG" dist/lando dist/SHA256SUMS --prerelease --target "${{ github.event.workflow_run.head_sha }}" --title "Lando v4 dev ${{ github.run_number }}" --notes "Generated Linux x64 dev prerelease from successful ci workflow run ${{ github.event.workflow_run.id }}."

  npm-alpha-packages:
    if: github.event.workflow_run.conclusion == 'success'
    needs: [dev-prerelease-linux-x64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .bun-version

      - name: Setup Node for npm trusted publishing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate derived sources
        run: bun run codegen

      - name: Build package artifacts
        run: |
          bun run --filter='@lando/sdk' build
          bun run --filter='@lando/paths' build
          bun run --filter='@lando/container-runtime' build
          bun run --filter='@lando/state-store' build
          bun run --filter='@lando/landofile' build
          bun run --filter='@lando/redaction' build
          bun run --filter='@lando/http-client' build
          bun run --filter='@lando/managed-file' build
          bun run --filter='@lando/data-mover' build
          bun run --filter='@lando/telemetry' build
          bun run --filter='@lando/engine' build
          bun run --filter='@lando/provider-lando' build
          bun run --filter='@lando/provider-docker' build
          bun run --filter='@lando/provider-podman' build
          bun run --filter='@lando/service-lando' build
          bun run --filter='@lando/logger-pretty' build
          bun run --filter='@lando/renderer-lando' build
          bun run --filter='@lando/notify-lando' build
          bun run --filter='@lando/file-sync-mutagen' build
          bun run --filter='@lando/ca-mkcert' build
          bun run --filter='@lando/proxy-traefik' build
          bun run --filter='@lando/ssh-agent' build
          bun run --filter='@lando/template-handlebars' build
          bun run --filter='@lando/template-mustache' build
          bun run --filter='@lando/core' typecheck
          bun run --filter='@lando/core' build:manifest

      - name: Prepare alpha package metadata
        env:
          LANDO_NPM_VERSION: 4.0.0-alpha.${{ github.run_number }}
          LANDO_NPM_DIST_TAG: dev
        run: bun run scripts/prepare-npm-dev-packages.ts

      - name: Dry-run npm dev publishes
        run: |
          npm publish --workspace @lando/sdk --dry-run --access public --tag dev
          npm publish --workspace @lando/paths --dry-run --access public --tag dev
          npm publish --workspace @lando/container-runtime --dry-run --access public --tag dev
          npm publish --workspace @lando/state-store --dry-run --access public --tag dev
          npm publish --workspace @lando/landofile --dry-run --access public --tag dev
          npm publish --workspace @lando/redaction --dry-run --access public --tag dev
          npm publish --workspace @lando/http-client --dry-run --access public --tag dev
          npm publish --workspace @lando/managed-file --dry-run --access public --tag dev
          npm publish --workspace @lando/data-mover --dry-run --access public --tag dev
          npm publish --workspace @lando/telemetry --dry-run --access public --tag dev
          npm publish --workspace @lando/engine --dry-run --access public --tag dev
          npm publish --workspace @lando/core --dry-run --access public --tag dev
          npm publish --workspace @lando/provider-lando --dry-run --access public --tag dev
          npm publish --workspace @lando/provider-docker --dry-run --access public --tag dev
          npm publish --workspace @lando/provider-podman --dry-run --access public --tag dev
          npm publish --workspace @lando/service-lando --dry-run --access public --tag dev
          npm publish --workspace @lando/logger-pretty --dry-run --access public --tag dev
          npm publish --workspace @lando/renderer-lando --dry-run --access public --tag dev
          npm publish --workspace @lando/notify-lando --dry-run --access public --tag dev
          npm publish --workspace @lando/file-sync-mutagen --dry-run --access public --tag dev
          npm publish --workspace @lando/ca-mkcert --dry-run --access public --tag dev
          npm publish --workspace @lando/proxy-traefik --dry-run --access public --tag dev
          npm publish --workspace @lando/ssh-agent --dry-run --access public --tag dev
          npm publish --workspace @lando/template-handlebars --dry-run --access public --tag dev
          npm publish --workspace @lando/template-mustache --dry-run --access public --tag dev

      - name: Publish npm dev packages
        run: |
          before_latest="$(npm view @lando/core dist-tags.latest --json 2>/dev/null || true)"
          npm publish --workspace @lando/sdk --access public --tag dev --provenance
          npm publish --workspace @lando/paths --access public --tag dev --provenance
          npm publish --workspace @lando/container-runtime --access public --tag dev --provenance
          npm publish --workspace @lando/state-store --access public --tag dev --provenance
          npm publish --workspace @lando/landofile --access public --tag dev --provenance
          npm publish --workspace @lando/redaction --access public --tag dev --provenance
          npm publish --workspace @lando/http-client --access public --tag dev --provenance
          npm publish --workspace @lando/managed-file --access public --tag dev --provenance
          npm publish --workspace @lando/data-mover --access public --tag dev --provenance
          npm publish --workspace @lando/telemetry --access public --tag dev --provenance
          npm publish --workspace @lando/engine --access public --tag dev --provenance
          npm publish --workspace @lando/core --access public --tag dev --provenance
          npm publish --workspace @lando/provider-lando --access public --tag dev --provenance
          npm publish --workspace @lando/provider-docker --access public --tag dev --provenance
          npm publish --workspace @lando/provider-podman --access public --tag dev --provenance
          npm publish --workspace @lando/service-lando --access public --tag dev --provenance
          npm publish --workspace @lando/logger-pretty --access public --tag dev --provenance
          npm publish --workspace @lando/renderer-lando --access public --tag dev --provenance
          npm publish --workspace @lando/notify-lando --access public --tag dev --provenance
          npm publish --workspace @lando/file-sync-mutagen --access public --tag dev --provenance
          npm publish --workspace @lando/ca-mkcert --access public --tag dev --provenance
          npm publish --workspace @lando/proxy-traefik --access public --tag dev --provenance
          npm publish --workspace @lando/ssh-agent --access public --tag dev --provenance
          npm publish --workspace @lando/template-handlebars --access public --tag dev --provenance
          npm publish --workspace @lando/template-mustache --access public --tag dev --provenance
          after_latest="$(npm view @lando/core dist-tags.latest --json 2>/dev/null || true)"
          test "$before_latest" = "$after_latest"
          npm view @lando/core dist-tags.dev --json | grep -Eq '"?4\.0\.0-alpha\.[0-9]+"?'

  npm-alpha-smoke:
    if: github.event.workflow_run.conclusion == 'success'
    needs: [npm-alpha-packages]
    permissions: {}
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0
        with:
          node-version: 22

      - name: Smoke-test published npm packages
        env:
          LANDO_NPM_VERSION: 4.0.0-alpha.${{ github.run_number }}
        run: |
          set -euo pipefail
          export SMOKE_ROOT="$RUNNER_TEMP/lando-npm-smoke"
          rm -rf "$SMOKE_ROOT"
          mkdir -p "$SMOKE_ROOT"
          cd "$SMOKE_ROOT"
          npm init --yes >/dev/null
          for package_spec in "@lando/sdk@$LANDO_NPM_VERSION" "@lando/paths@$LANDO_NPM_VERSION" "@lando/container-runtime@$LANDO_NPM_VERSION" "@lando/state-store@$LANDO_NPM_VERSION" "@lando/landofile@$LANDO_NPM_VERSION" "@lando/redaction@$LANDO_NPM_VERSION" "@lando/http-client@$LANDO_NPM_VERSION" "@lando/managed-file@$LANDO_NPM_VERSION" "@lando/data-mover@$LANDO_NPM_VERSION" "@lando/telemetry@$LANDO_NPM_VERSION" "@lando/engine@$LANDO_NPM_VERSION" "@lando/core@$LANDO_NPM_VERSION" "@lando/provider-lando@$LANDO_NPM_VERSION" "@lando/provider-docker@$LANDO_NPM_VERSION" "@lando/provider-podman@$LANDO_NPM_VERSION" "@lando/service-lando@$LANDO_NPM_VERSION" "@lando/logger-pretty@$LANDO_NPM_VERSION" "@lando/renderer-lando@$LANDO_NPM_VERSION" "@lando/notify-lando@$LANDO_NPM_VERSION" "@lando/file-sync-mutagen@$LANDO_NPM_VERSION" "@lando/ca-mkcert@$LANDO_NPM_VERSION" "@lando/proxy-traefik@$LANDO_NPM_VERSION" "@lando/ssh-agent@$LANDO_NPM_VERSION" "@lando/template-handlebars@$LANDO_NPM_VERSION" "@lando/template-mustache@$LANDO_NPM_VERSION"; do
            for attempt in {1..30}; do
              if test "$(npm view "$package_spec" version 2>/dev/null || true)" = "$LANDO_NPM_VERSION"; then
                break
              fi
              if test "$attempt" -eq 30; then
                echo "$package_spec did not propagate to npm in time" >&2
                exit 1
              fi
              sleep 2
            done
          done
          npm install --ignore-scripts --no-audit --no-fund "@lando/core@$LANDO_NPM_VERSION"
          bun -e 'Bun.resolveSync("@lando/engine", process.env.SMOKE_ROOT); Bun.resolveSync("@lando/landofile", process.env.SMOKE_ROOT); await import("@lando/core/testing");'
          bun -e 'const core = await import("@lando/core"); if (typeof core.makeLandoRuntime !== "function" || typeof core.openLandoRuntime !== "function") throw new Error("@lando/core runtime exports are unavailable"); const bundledPluginResolved = await import("@lando/provider-lando").then(() => true, () => false); if (bundledPluginResolved) throw new Error("bundled plugin resolved before installation");'
          npm install --ignore-scripts --no-audit --no-fund "@lando/provider-lando@$LANDO_NPM_VERSION" "@lando/provider-docker@$LANDO_NPM_VERSION" "@lando/provider-podman@$LANDO_NPM_VERSION" "@lando/service-lando@$LANDO_NPM_VERSION" "@lando/logger-pretty@$LANDO_NPM_VERSION" "@lando/renderer-lando@$LANDO_NPM_VERSION" "@lando/notify-lando@$LANDO_NPM_VERSION" "@lando/file-sync-mutagen@$LANDO_NPM_VERSION" "@lando/ca-mkcert@$LANDO_NPM_VERSION" "@lando/proxy-traefik@$LANDO_NPM_VERSION" "@lando/ssh-agent@$LANDO_NPM_VERSION" "@lando/template-handlebars@$LANDO_NPM_VERSION" "@lando/template-mustache@$LANDO_NPM_VERSION"
          bun -e 'const bundled = await import("@lando/core/bundled-plugins"); const core = await import("@lando/core"); if (bundled.BUNDLED_PLUGIN_MODULES.length !== 12 || typeof core.makeLandoRuntime !== "function") throw new Error("@lando/core bundled composition is unavailable");'

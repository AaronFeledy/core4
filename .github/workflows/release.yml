# Generated by scripts/codegen.ts — do not hand-edit. Edit scripts/build-release-workflow.ts instead.
#
# Scope: dev prerelease only. This workflow does not produce a signed release; it republishes
# six unsigned binaries for every CI platform as a v4.0.0-dev.N GitHub prerelease.
# The full signed release pipeline (scripts/release.ts) is invoked manually, not by this workflow.
# Runbook: docs/contributing/release.md.
name: release

on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  dev-prerelease:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .bun-version

      - name: Verify committed runtime-bundle manifest resolves live
        run: bun run check:runtime-bundle-manifest --live

      - name: Download and stage binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ github.event.workflow_run.id }}" --name lando-darwin-arm64 --dir dist/artifacts/darwin-arm64
          test -f dist/artifacts/darwin-arm64/lando
          mv dist/artifacts/darwin-arm64/lando dist/lando-darwin-arm64
          chmod +x dist/lando-darwin-arm64
          test -f dist/lando-darwin-arm64
          gh run download "${{ github.event.workflow_run.id }}" --name lando-darwin-x64 --dir dist/artifacts/darwin-x64
          test -f dist/artifacts/darwin-x64/lando
          mv dist/artifacts/darwin-x64/lando dist/lando-darwin-x64
          chmod +x dist/lando-darwin-x64
          test -f dist/lando-darwin-x64
          gh run download "${{ github.event.workflow_run.id }}" --name lando-linux-arm64 --dir dist/artifacts/linux-arm64
          test -f dist/artifacts/linux-arm64/lando
          mv dist/artifacts/linux-arm64/lando dist/lando-linux-arm64
          chmod +x dist/lando-linux-arm64
          test -f dist/lando-linux-arm64
          gh run download "${{ github.event.workflow_run.id }}" --name lando-linux-x64 --dir dist/artifacts/linux-x64
          test -f dist/artifacts/linux-x64/lando
          mv dist/artifacts/linux-x64/lando dist/lando-linux-x64
          chmod +x dist/lando-linux-x64
          test -f dist/lando-linux-x64
          gh run download "${{ github.event.workflow_run.id }}" --name lando-windows-x64 --dir dist/artifacts/windows-x64
          test -f dist/artifacts/windows-x64/lando-windows-x64.exe
          mv dist/artifacts/windows-x64/lando-windows-x64.exe dist/lando-windows-x64.exe
          test -f dist/lando-windows-x64.exe
          gh run download "${{ github.event.workflow_run.id }}" --name lando-windows-arm64 --dir dist/artifacts/windows-arm64
          test -f dist/artifacts/windows-arm64/lando-windows-arm64.exe
          mv dist/artifacts/windows-arm64/lando-windows-arm64.exe dist/lando-windows-arm64.exe
          test -f dist/lando-windows-arm64.exe

      - name: Install first-launch sandbox tools
        run: |
          sudo apt-get update
          sudo apt-get install -y strace iproute2

      - name: Sandboxed first launch has no non-loopback network calls
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lando-conf" "$RUNNER_TEMP/lando-data" "$RUNNER_TEMP/lando-cache"
          sudo env LANDO_USER_CONF_ROOT="$RUNNER_TEMP/lando-conf" LANDO_USER_DATA_ROOT="$RUNNER_TEMP/lando-data" LANDO_USER_CACHE_ROOT="$RUNNER_TEMP/lando-cache" unshare --net bash -c '
            set -euo pipefail
            ip link set lo up
            strace -f -e trace=network -o dist/first-launch.network.log ./dist/lando-linux-x64 --version
          '
          awk '/connect\(/ && $0 !~ /(127\.|::1|AF_UNIX)/ { bad = 1 } END { exit bad }' dist/first-launch.network.log

      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          : > SHA256SUMS
          sha256sum lando-darwin-arm64 >> SHA256SUMS
          grep -Eq '^[0-9a-f]{64}  lando-darwin-arm64$' SHA256SUMS
          sha256sum lando-darwin-x64 >> SHA256SUMS
          grep -Eq '^[0-9a-f]{64}  lando-darwin-x64$' SHA256SUMS
          sha256sum lando-linux-arm64 >> SHA256SUMS
          grep -Eq '^[0-9a-f]{64}  lando-linux-arm64$' SHA256SUMS
          sha256sum lando-linux-x64 >> SHA256SUMS
          grep -Eq '^[0-9a-f]{64}  lando-linux-x64$' SHA256SUMS
          sha256sum lando-windows-x64.exe >> SHA256SUMS
          grep -Eq '^[0-9a-f]{64}  lando-windows-x64.exe$' SHA256SUMS
          sha256sum lando-windows-arm64.exe >> SHA256SUMS
          grep -Eq '^[0-9a-f]{64}  lando-windows-arm64.exe$' SHA256SUMS

      - name: Publish dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v4.0.0-dev.${{ github.run_number }}
        run: |
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_TAG" dist/lando-darwin-arm64 dist/lando-darwin-x64 dist/lando-linux-arm64 dist/lando-linux-x64 dist/lando-windows-x64.exe dist/lando-windows-arm64.exe dist/SHA256SUMS --prerelease --target "${{ github.event.workflow_run.head_sha }}" --title "Lando v4 dev ${{ github.run_number }}" --notes "Unsigned six-target dev prerelease from successful ci run ${{ github.event.workflow_run.id }}."

# Generated by scripts/codegen.ts. Edit scripts/build-compose-vendor-bump-workflow.ts instead.
name: "compose-vendor-bump"
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
concurrency:
  group: compose-vendor-bump
  cancel-in-progress: false
permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: "Bump compose-go vendored schema and open rolling PR"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH='automation/compose-go-bump'
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git fetch origin main:refs/remotes/origin/main
          BRANCH_EXISTS=false
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            BRANCH_EXISTS=true
            git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git merge --no-edit origin/main
          else
            git checkout -b "$BRANCH"
          fi
          TARGET_TAG="$(gh api --paginate repos/compose-spec/compose-go/tags --jq '.[].name' | bun -e 'const { selectNewerComposeGoTag, readComposeVendorPin } = await import("./scripts/compose-vendor.ts"); const pin = await readComposeVendorPin("vendor/compose/pin.json"); const candidates = (await new Response(Bun.stdin.stream()).text()).split("\n").map((line) => line.trim()).filter(Boolean); const newer = selectNewerComposeGoTag(pin.tag, candidates); if (newer !== undefined) process.stdout.write(newer);')"
          if [ -z "$TARGET_TAG" ]; then
            if [ "$BRANCH_EXISTS" = false ] || git diff --quiet origin/main...HEAD -- vendor/compose/pin.json vendor/compose/compose-spec.json; then
              echo "::notice title=compose-vendor-bump::compose-go pin is already current; nothing to bump."
              exit 0
            fi
            TARGET_TAG="$(bun -e 'const { readComposeVendorPin } = await import("./scripts/compose-vendor.ts"); const pin = await readComposeVendorPin("vendor/compose/pin.json"); process.stdout.write(pin.tag);')"
            echo "::notice title=compose-vendor-bump::reconciling the existing $TARGET_TAG bump branch."
          else
            echo "::notice title=compose-vendor-bump::bumping compose-go pin to $TARGET_TAG"
          fi
          git show origin/main:vendor/compose/compose-spec.json > "$RUNNER_TEMP/old-compose-spec.json"
          bun run codegen:compose-vendor --tag "$TARGET_TAG"
          if [ -z "$(git status --porcelain=v1 --untracked-files=all -- 'vendor/compose/pin.json' 'vendor/compose/compose-spec.json')" ] && git diff --quiet origin/main...HEAD -- 'vendor/compose/pin.json' 'vendor/compose/compose-spec.json'; then
            exit 0
          fi
          TITLE="bump compose-go vendored schema to $TARGET_TAG"
          BODY_FILE="$RUNNER_TEMP/pr-body.md"
          # Report only: classification stays with a person, so a failing gate never stops the proposal.
          COVERAGE_OUTPUT="$RUNNER_TEMP/compose-coverage.txt"
          if bun run check:compose-coverage > "$COVERAGE_OUTPUT" 2>&1; then
            printf '%s\n\n%s\n' '## Key path classification' 'Every Compose key path has a disposition.' > "$BODY_FILE"
          else
            {
              printf '%s\n\n' '## Key path classification needed'
              printf '%s\n\n' 'This PR cannot merge until `bun run check:compose-coverage` passes. Fix what it reports in `sdk/src/landofile/compose-dispositions.ts`: give each unclassified key path a disposition and remove any entry it flags. Then run `bun run codegen:compose-key-matrix` and push to this branch.'
              printf '%s\n' '```text'
              cat "$COVERAGE_OUTPUT"
              if [ -n "$(tail -c 1 "$COVERAGE_OUTPUT")" ]; then printf '\n'; fi
              printf '%s\n' '```'
            } > "$BODY_FILE"
          fi
          printf '\n' >> "$BODY_FILE"
          bun run scripts/report-compose-schema-diff.ts "$RUNNER_TEMP/old-compose-spec.json" vendor/compose/compose-spec.json >> "$BODY_FILE"
          if [ -n "$(git status --porcelain=v1 --untracked-files=all -- 'vendor/compose/pin.json' 'vendor/compose/compose-spec.json')" ]; then
            git add -- 'vendor/compose/pin.json' 'vendor/compose/compose-spec.json'
            git commit -m "$TITLE" --only -- 'vendor/compose/pin.json' 'vendor/compose/compose-spec.json'
          fi
          git push origin "HEAD:$BRANCH"
          PR_NUMBER="$(gh pr list --state open --head "$BRANCH" --json number --jq '.[].number')"
          REPORT_START='<!-- maintenance-report:start -->'
          REPORT_END='<!-- maintenance-report:end -->'
          REPORT="$(cat "$BODY_FILE")"
          printf -v REPORT_SECTION '%s\n%s\n%s' "$REPORT_START" "$REPORT" "$REPORT_END"
          PR_BODY_FILE="$RUNNER_TEMP/maintenance-pr-body.md"
          if [ -z "$PR_NUMBER" ]; then
            printf '%s\n' "$REPORT_SECTION" > "$PR_BODY_FILE"
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$PR_BODY_FILE"
          else
            # The PR body is untrusted data: keep it in variables and files only.
            # A marker counts only at the start of a line, so prose that quotes one is left alone.
            # The owned section ends at the first end marker and starts at the nearest start marker
            # above it, so nothing outside one well-formed pair is ever removed.
            NL=$'\n'
            CURRENT_BODY="$NL$(gh pr view "$PR_NUMBER" --json body --jq '.body')"
            BEFORE_END="${CURRENT_BODY%%"$NL$REPORT_END"*}"
            BEFORE_START="${BEFORE_END%"$NL$REPORT_START"*}"
            if [ "$BEFORE_END" != "$CURRENT_BODY" ] && [ "$BEFORE_START" != "$BEFORE_END" ]; then
              MERGED_BODY="$BEFORE_START$NL$REPORT_SECTION${CURRENT_BODY#*"$NL$REPORT_END"}"
              printf '%s\n' "${MERGED_BODY#"$NL"}" > "$PR_BODY_FILE"
            else
              printf '%s\n' "$REPORT_SECTION" > "$PR_BODY_FILE"
            fi
            gh pr edit "$BRANCH" --title "$TITLE" --body-file "$PR_BODY_FILE"
          fi
          gh workflow run ci.yml --ref "$BRANCH"
  report-failure:
    needs: [bump]
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report automation failure
        run: |
          set -euo pipefail
          TITLE='compose-vendor-bump automation failure'
          BODY="Workflow run failed: $RUN_URL"
          ISSUE_NUMBER="$(gh issue list --state open --search 'in:title "compose-vendor-bump automation failure" sort:created-asc' --limit 100 --json number,title --jq '[.[] | select(.title == "compose-vendor-bump automation failure")] | .[0].number // ""')"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

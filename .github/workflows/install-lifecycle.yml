# Generated by scripts/build-install-lifecycle-journey-workflow.ts; do not hand-edit.
name: install-lifecycle

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: install-lifecycle-evidence
  cancel-in-progress: false

jobs:
  container-helper:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Isolate Lando roots
        shell: bash
        run: |
          echo "LANDO_USER_CONF_ROOT=$RUNNER_TEMP/lando-conf" >> "$GITHUB_ENV"
          echo "LANDO_USER_DATA_ROOT=$RUNNER_TEMP/lando-data" >> "$GITHUB_ENV"
          echo "LANDO_USER_CACHE_ROOT=$RUNNER_TEMP/lando-cache" >> "$GITHUB_ENV"
          echo "LANDO_SYSTEM_PLUGIN_ROOT=$RUNNER_TEMP/lando-system-plugins" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate derived sources
        run: bun run codegen

      # The builder publishes no routes, so the job skips router setup.
      - name: Set up Lando with Docker
        run: bun core/bin/lando.ts setup --yes --provider=docker --skip-proxy --skip-install-ca --skip-shell-integration --skip-file-sync

      - name: Build and test the container helper with Lando
        run: |
          bun run scripts/build-container-helper.ts --test
          bun test core/test/container-helper/helper.integration.test.ts

      - name: Upload container helper
        uses: actions/upload-artifact@v6
        with:
          name: container-helper
          path: core/container-helper/dist/
          if-no-files-found: error
          retention-days: 14

  install-lifecycle-linux-x64:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [container-helper]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LANDO_LIFECYCLE_FRESH_RUNNER: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Isolate Lando roots
        shell: bash
        run: |
          echo "LANDO_USER_CONF_ROOT=$RUNNER_TEMP/lando-conf" >> "$GITHUB_ENV"
          echo "LANDO_USER_DATA_ROOT=$RUNNER_TEMP/lando-data" >> "$GITHUB_ENV"
          echo "LANDO_USER_CACHE_ROOT=$RUNNER_TEMP/lando-cache" >> "$GITHUB_ENV"
          echo "LANDO_SYSTEM_PLUGIN_ROOT=$RUNNER_TEMP/lando-system-plugins" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate derived sources
        run: bun run codegen

      - name: Download container helper
        uses: actions/download-artifact@v7
        with:
          name: container-helper
          path: core/container-helper/dist

      - name: Restore container helper permissions
        shell: bash
        run: chmod +x core/container-helper/dist/linux-*/lando-container-helper

      - name: Build command registry manifest
        run: bun run --filter='@lando/core' build:manifest

      - name: Build linux-x64 binary
        run: |
          mkdir -p dist
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "0.0.0-dev")
          bun run scripts/build-compiled-binary.ts --target bun-linux-x64 --outfile ./dist/lando --version "$VERSION" --minify --sourcemap=external

      - name: Provision rootless runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y uidmap fuse-overlayfs
          if ! grep -q "^$(id -un):" /etc/subuid; then
            echo "$(id -un):100000:65536" | sudo tee -a /etc/subuid
          fi
          if ! grep -q "^$(id -un):" /etc/subgid; then
            echo "$(id -un):100000:65536" | sudo tee -a /etc/subgid
          fi
          sudo sysctl net.ipv4.ip_unprivileged_port_start=0
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if ! grep -q "systemd.unified_cgroup_hierarchy" /proc/cmdline; then
            echo "::notice title=ci-runtime::cgroups v2 unified hierarchy assumed via Ubuntu LTS default (systemd.unified_cgroup_hierarchy)"
          fi
          sudo mkdir -p /sys/fs/cgroup/user.slice/user-$(id -u).slice
          sudo chown -R "$(id -un)" "/sys/fs/cgroup/user.slice/user-$(id -u).slice" || true

      - name: Install, setup, serve HTTP, destroy, uninstall
        run: bun run scripts/install-lifecycle-journey.ts --binary "dist/lando" --work-dir "${{ runner.temp }}/install-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}" --report "${{ runner.temp }}/install-lifecycle.json"

      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: install-lifecycle-linux-x64
          path: ${{ runner.temp }}/install-lifecycle.json
          if-no-files-found: error
          retention-days: 14

  install-lifecycle-windows-x64:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [container-helper]
    runs-on: [self-hosted, lando-virt, Windows, X64]
    timeout-minutes: 90
    env:
      LANDO_LIFECYCLE_FRESH_RUNNER: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Isolate Lando roots
        shell: bash
        run: |
          echo "LANDO_USER_CONF_ROOT=$RUNNER_TEMP/lando-conf" >> "$GITHUB_ENV"
          echo "LANDO_USER_DATA_ROOT=$RUNNER_TEMP/lando-data" >> "$GITHUB_ENV"
          echo "LANDO_USER_CACHE_ROOT=$RUNNER_TEMP/lando-cache" >> "$GITHUB_ENV"
          echo "LANDO_SYSTEM_PLUGIN_ROOT=$RUNNER_TEMP/lando-system-plugins" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate derived sources
        run: bun run codegen

      - name: Download container helper
        uses: actions/download-artifact@v7
        with:
          name: container-helper
          path: core/container-helper/dist

      - name: Restore container helper permissions
        shell: bash
        run: chmod +x core/container-helper/dist/linux-*/lando-container-helper

      - name: Build command registry manifest
        run: bun run --filter='@lando/core' build:manifest

      - name: Build windows-x64 binary
        run: |
          mkdir -p dist
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "0.0.0-dev")
          bun run scripts/build-compiled-binary.ts --target bun-windows-x64 --outfile ./dist/lando-windows-x64.exe --version "$VERSION" --minify --sourcemap=external



      - name: Install, setup, serve HTTP, destroy, uninstall
        run: bun run scripts/install-lifecycle-journey.ts --binary "dist/lando-windows-x64.exe" --work-dir "${{ runner.temp }}/install-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}" --report "${{ runner.temp }}/install-lifecycle.json"

      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: install-lifecycle-windows-x64
          path: ${{ runner.temp }}/install-lifecycle.json
          if-no-files-found: error
          retention-days: 14

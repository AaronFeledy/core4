# Generated by scripts/codegen.ts. Edit scripts/build-tomcat-bump-workflow.ts instead.
name: "tomcat-bump"
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
concurrency:
  group: tomcat-bump
  cancel-in-progress: false
permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: "Prepare and check paired Tomcat update"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH='automation/tomcat-bump'
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git fetch origin main:refs/remotes/origin/main
          BRANCH_EXISTS=false
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            BRANCH_EXISTS=true
            git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git merge --no-edit origin/main
          else
            git checkout -b "$BRANCH"
          fi
          BASELINE="$RUNNER_TEMP/tomcat-baseline"
          mkdir -p "$BASELINE"
          for file in pins.json server-9.xml server-10.xml server-11.xml; do
            git show "origin/main:plugins/service-lando/tomcat/$file" > "$BASELINE/$file"
          done
          bun run update:tomcat
          if [ -z "$(git status --porcelain=v1 --untracked-files=all -- 'plugins/service-lando/tomcat')" ] && git diff --quiet origin/main...HEAD -- 'plugins/service-lando/tomcat'; then
            exit 0
          fi
          bun run codegen
          bun run test:selection tomcat-bump
          TITLE="bump paired Tomcat images and configuration"
          BODY_FILE="$RUNNER_TEMP/tomcat-pr.md"
          bun run scripts/report-tomcat-update.ts "$BASELINE" plugins/service-lando/tomcat > "$BODY_FILE"
          if [ -n "$(git status --porcelain=v1 --untracked-files=all -- 'plugins/service-lando/tomcat')" ]; then
            git add -- 'plugins/service-lando/tomcat'
            git commit -m "$TITLE" --only -- 'plugins/service-lando/tomcat'
          fi
          git push origin "HEAD:$BRANCH"
          PR_NUMBER="$(gh pr list --state open --head "$BRANCH" --json number --jq '.[].number')"
          REPORT_START='<!-- maintenance-report:start -->'
          REPORT_END='<!-- maintenance-report:end -->'
          REPORT="$(cat "$BODY_FILE")"
          printf -v REPORT_SECTION '%s\n%s\n%s' "$REPORT_START" "$REPORT" "$REPORT_END"
          PR_BODY_FILE="$RUNNER_TEMP/maintenance-pr-body.md"
          if [ -z "$PR_NUMBER" ]; then
            printf '%s\n' "$REPORT_SECTION" > "$PR_BODY_FILE"
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$PR_BODY_FILE"
          else
            # The PR body is untrusted data: keep it in variables and files only.
            # A marker counts only at the start of a line, so prose that quotes one is left alone.
            # The owned section ends at the first end marker and starts at the nearest start marker
            # above it, so nothing outside one well-formed pair is ever removed.
            NL=$'\n'
            CURRENT_BODY="$NL$(gh pr view "$PR_NUMBER" --json body --jq '.body')"
            BEFORE_END="${CURRENT_BODY%%"$NL$REPORT_END"*}"
            BEFORE_START="${BEFORE_END%"$NL$REPORT_START"*}"
            if [ "$BEFORE_END" != "$CURRENT_BODY" ] && [ "$BEFORE_START" != "$BEFORE_END" ]; then
              MERGED_BODY="$BEFORE_START$NL$REPORT_SECTION${CURRENT_BODY#*"$NL$REPORT_END"}"
              printf '%s\n' "${MERGED_BODY#"$NL"}" > "$PR_BODY_FILE"
            else
              printf '%s\n' "$REPORT_SECTION" > "$PR_BODY_FILE"
            fi
            gh pr edit "$BRANCH" --title "$TITLE" --body-file "$PR_BODY_FILE"
          fi
          gh workflow run ci.yml --ref "$BRANCH"
  report-failure:
    needs: [bump]
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report automation failure
        run: |
          set -euo pipefail
          TITLE='tomcat-bump automation failure'
          BODY="Workflow run failed: $RUN_URL"
          ISSUE_NUMBER="$(gh issue list --state open --search 'in:title "tomcat-bump automation failure" sort:created-asc' --limit 100 --json number,title --jq '[.[] | select(.title == "tomcat-bump automation failure")] | .[0].number // ""')"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

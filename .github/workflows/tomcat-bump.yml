# Generated by scripts/codegen.ts. Edit scripts/build-tomcat-bump-workflow.ts instead.
name: tomcat-bump
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
concurrency:
  group: tomcat-bump
  cancel-in-progress: false
permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Prepare and check paired Tomcat update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git fetch origin main:refs/remotes/origin/main
          if git ls-remote --exit-code --heads origin automation/tomcat-bump >/dev/null 2>&1; then
            git fetch origin automation/tomcat-bump:refs/remotes/origin/automation/tomcat-bump
            git checkout -B automation/tomcat-bump origin/automation/tomcat-bump
            git merge --no-edit origin/main
          else
            git checkout -b automation/tomcat-bump
          fi
          BASELINE="$RUNNER_TEMP/tomcat-baseline"
          mkdir -p "$BASELINE"
          for file in pins.json server-9.xml server-10.xml server-11.xml; do
            git show "origin/main:plugins/service-lando/tomcat/$file" > "$BASELINE/$file"
          done
          bun run update:tomcat
          if git diff --quiet -- plugins/service-lando/tomcat && git diff --quiet origin/main...HEAD -- plugins/service-lando/tomcat; then
            exit 0
          fi
          bun run codegen
          bun test plugins/service-lando/test/tomcat.test.ts plugins/service-lando/test/tomcat-port.test.ts core/test/scripts/tomcat-update.test.ts core/test/scripts/tomcat-catalog.test.ts core/test/build/tomcat-bump-workflow.test.ts
          bun run scripts/report-tomcat-update.ts "$BASELINE" plugins/service-lando/tomcat > "$RUNNER_TEMP/tomcat-pr.md"
          if ! git diff --quiet -- plugins/service-lando/tomcat; then
            git add plugins/service-lando/tomcat
            git commit -m "bump paired Tomcat images and configuration"
          fi
          git push origin HEAD:automation/tomcat-bump
          if [ -z "$(gh pr list --state open --head automation/tomcat-bump --json number --jq '.[].number')" ]; then
            gh pr create --base main --head automation/tomcat-bump --title "bump paired Tomcat images and configuration" --body-file "$RUNNER_TEMP/tomcat-pr.md"
          else
            gh pr edit automation/tomcat-bump --title "bump paired Tomcat images and configuration" --body-file "$RUNNER_TEMP/tomcat-pr.md"
          fi
          gh workflow run ci.yml --ref automation/tomcat-bump
  report-failure:
    needs: [bump]
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report automation failure
        run: |
          set -euo pipefail
          TITLE='tomcat-bump automation failure'
          BODY="Workflow run failed: $RUN_URL"
          ISSUE="$(gh issue list --state open --limit 100 --json number,title --jq '[.[] | select(.title == "tomcat-bump automation failure")] | .[0].number // ""')"
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

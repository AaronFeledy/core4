# Generated by scripts/codegen.ts. Edit scripts/build-node-releases-bump-workflow.ts instead.
name: "node-releases-bump"
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
concurrency:
  group: node-releases-bump
  cancel-in-progress: false
permissions:
  actions: write
  contents: write
  pull-requests: write
jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: "Prepare and check Node release schedule update"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH='automation/node-releases-bump'
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git fetch origin main:refs/remotes/origin/main
          BRANCH_EXISTS=false
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            BRANCH_EXISTS=true
            git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git merge --no-edit origin/main
          else
            git checkout -b "$BRANCH"
          fi
          BASELINE="$RUNNER_TEMP/node-releases-baseline"
          mkdir -p "$BASELINE"
          git show "origin/main:plugins/service-lando/node/releases.json" > "$BASELINE/releases.json"
          bun run update:node-releases
          if [ -z "$(git status --porcelain=v1 --untracked-files=all -- 'plugins/service-lando/node')" ] && git diff --quiet origin/main...HEAD -- 'plugins/service-lando/node'; then
            exit 0
          fi
          bun run codegen
          bun run test:selection node-releases-bump
          TITLE="bump Node release schedule"
          BODY_FILE="$RUNNER_TEMP/node-releases-pr.md"
          bun run scripts/report-node-releases-update.ts "$BASELINE/releases.json" plugins/service-lando/node/releases.json > "$BODY_FILE"
          if [ -n "$(git status --porcelain=v1 --untracked-files=all -- 'plugins/service-lando/node')" ]; then
            git add -- 'plugins/service-lando/node'
            git commit -m "$TITLE" --only -- 'plugins/service-lando/node'
          fi
          git push origin "HEAD:$BRANCH"
          PR_NUMBER="$(gh pr list --state open --head "$BRANCH" --json number --jq '.[].number')"
          REPORT_START='<!-- maintenance-report:start -->'
          REPORT_END='<!-- maintenance-report:end -->'
          REPORT="$(cat "$BODY_FILE")"
          printf -v REPORT_SECTION '%s\n%s\n%s' "$REPORT_START" "$REPORT" "$REPORT_END"
          PR_BODY_FILE="$RUNNER_TEMP/maintenance-pr-body.md"
          if [ -z "$PR_NUMBER" ]; then
            printf '%s\n' "$REPORT_SECTION" > "$PR_BODY_FILE"
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$PR_BODY_FILE"
          else
            # The PR body is untrusted data: keep it in variables and files only.
            # A marker counts only at the start of a line, so prose that quotes one is left alone.
            # The owned section ends at the first end marker and starts at the nearest start marker
            # above it, so nothing outside one well-formed pair is ever removed.
            NL=$'\n'
            CURRENT_BODY="$NL$(gh pr view "$PR_NUMBER" --json body --jq '.body')"
            BEFORE_END="${CURRENT_BODY%%"$NL$REPORT_END"*}"
            BEFORE_START="${BEFORE_END%"$NL$REPORT_START"*}"
            if [ "$BEFORE_END" != "$CURRENT_BODY" ] && [ "$BEFORE_START" != "$BEFORE_END" ]; then
              MERGED_BODY="$BEFORE_START$NL$REPORT_SECTION${CURRENT_BODY#*"$NL$REPORT_END"}"
              printf '%s\n' "${MERGED_BODY#"$NL"}" > "$PR_BODY_FILE"
            else
              printf '%s\n' "$REPORT_SECTION" > "$PR_BODY_FILE"
            fi
            gh pr edit "$BRANCH" --title "$TITLE" --body-file "$PR_BODY_FILE"
          fi
          gh workflow run ci.yml --ref "$BRANCH"
  report-failure:
    needs: [bump]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Report automation failure
        run: |
          set -euo pipefail
          FAILED_JOBS="$(jq -r '
            [to_entries[] | .value.result as $result
              | select($result != "success" and $result != "skipped")
              | .key + (if $result == "failure" then ""
                        elif $result == "cancelled" then " (timed out or cancelled)"
                        else " (\($result))" end)] | join(", ")
          ' <<< "$NEEDS_JSON")"
          if [ -z "$FAILED_JOBS" ]; then
            echo "No unsuccessful jobs."
            exit 0
          fi
          SUMMARY_FILE="$RUNNER_TEMP/failure-summary.md"
          BODY_FILE="$RUNNER_TEMP/failure-issue.md"
          printf 'Workflow run failed: %s\n\nFailed jobs: %s\n' "$RUN_URL" "$FAILED_JOBS" > "$SUMMARY_FILE"
          cp "$SUMMARY_FILE" "$BODY_FILE"
          # Log evidence is best effort: the issue is filed even when job details or logs are unreadable.
          # Log text is untrusted, so it only moves through files and is fenced in the body.
          JOBS_FILE="$RUNNER_TEMP/failed-jobs.tsv"
          if timeout 20 gh api "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" --paginate --jq '.jobs[] | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped") | [.id, .name, ([.steps[]? | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | .name][0] // "")] | @tsv' > "$JOBS_FILE"; then
            SHOWN=0
            ATTEMPTS=0
            while IFS=$'\t' read -r -u 3 JOB_ID JOB_NAME STEP_NAME; do
              if [ "$SHOWN" -eq 5 ] || [ "$ATTEMPTS" -eq 8 ]; then
                printf '\nLogs for the remaining failed jobs are in the run.\n' >> "$BODY_FILE"
                break
              fi
              ATTEMPTS=$((ATTEMPTS + 1))
              LOG_FILE="$RUNNER_TEMP/job-$JOB_ID.log"
              TAIL_FILE="$RUNNER_TEMP/job-$JOB_ID.tail"
              timeout 20 gh api "repos/$GH_REPO/actions/jobs/$JOB_ID/logs" > "$LOG_FILE" || continue
              awk '{ sub(/\r$/, ""); sub(/^(\357\273\277)?[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]T[0-9:.]+Z ?/, ""); gsub(/\033\[[0-9;]*[A-Za-z]/, ""); if ($0 ~ /^##\[endgroup\]$/ || $0 ~ /^[[:space:]]*$/) next; sub(/^##\[group\]/, ""); line[++count] = substr($0, 1, 240); if (!exited && $0 ~ /^##\[error\]Process completed with exit code/) exited = count; if ($0 ~ /^##\[error\]/) last = count }; END { end = exited ? exited : (last ? last : count); for (i = (end > 30 ? end - 29 : 1); i <= end; i++) print line[i] }' "$LOG_FILE" > "$TAIL_FILE" || continue
              FENCE='```'
              while grep -qF -- "$FENCE" "$TAIL_FILE"; do FENCE="$FENCE\`"; done
              {
                printf '\n### %s' "$JOB_NAME"
                if [ -n "$STEP_NAME" ]; then printf ': %s' "$STEP_NAME"; fi
                printf '\n\n%s\n' "$FENCE"
                cat "$TAIL_FILE"
                printf '%s\n' "$FENCE"
              } >> "$BODY_FILE"
              SHOWN=$((SHOWN + 1))
            done 3< "$JOBS_FILE"
          fi
          TITLE='node-releases-bump automation failure'
          ISSUE_NUMBER="$(gh issue list --state open --search 'in:title "node-releases-bump automation failure" sort:created-asc' --limit 100 --json number,title --jq '[.[] | select(.title == "node-releases-bump automation failure")] | .[0].number // ""')"
          post() {
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue comment "$ISSUE_NUMBER" --body-file "$1"
            else
              gh issue create --title "$TITLE" --body-file "$1"
            fi
          }
          # Quoted log bytes can make GitHub reject the body; the summary alone must still land.
          post "$BODY_FILE" || post "$SUMMARY_FILE"

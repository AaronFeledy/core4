    shell: bash

permissions:
  contents: read
  pull-requests: read

jobs:
  static-checks-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runs-on: macos-15
          - platform: darwin-x64
            runs-on: macos-15-intel
          - platform: linux-arm64
            runs-on: ubuntu-24.04-arm
          - platform: linux-x64
            runs-on: ubuntu-24.04
          - platform: linux-x64
            runs-on: ubuntu-26.04
          - platform: windows-x64
            runs-on: windows-2022
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Mark job start
        run: echo "CI_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate and verify codegen catalog
        run: bun run codegen:check

      - name: Lint
        run: bun run lint

      - name: Import cycle lint
        run: bun run check:import-cycle

      - name: Package DAG lint
        run: bun run check:package-dag

      - name: Renderer boundary lint
        run: bun run check:renderer-boundary

      - name: Spec reference boundary lint
        run: bun run check:spec-reference

      - name: Managed-file boundary lint
        run: bun run check:managed-file-boundary

      - name: Telemetry inventory lint
        run: bun run check:telemetry-inventory

      - name: Redaction boundary lint
        run: bun run check:redaction-boundary

      - name: Env helper boundary lint
        run: bun run check:env-helper-boundary

      - name: Generated output boundary lint
        run: bun run check:generated-output

      - name: Paths boundary lint
        run: bun run check:paths-boundary

      - name: State-store boundary lint
        run: bun run check:state-store-boundary

      - name: Probe boundary lint
        run: bun run check:probe-boundary

      - name: Network boundary lint
        run: bun run check:network-boundary

      - name: Compose schema coverage
        run: bun run check:compose-coverage

      - name: Libpod API prefix lint
        run: bun run check:libpod-prefix

      - name: Machine output boundary lint
        run: bun run check:machine-output

      - name: Runtime-bundle manifest invariant
        run: bun run check:runtime-bundle-manifest

      - name: Static scope notice for portable static matrix
        run: |
          echo "::notice title=static-checks-scope::${{ matrix.platform }} on ${{ matrix.runs-on }} runs fork-safe portable static gates only; linux-x64 unit tests run as unit-tests-linux-x64 on ubuntu-24.04, ubuntu-26.04. Full cross-platform static test portability remains a follow-up portability effort."

      - name: Report job timing
        if: always()
        run: |
          echo "::notice title=ci-timing::static-checks/${{ matrix.platform }}/${{ matrix.runs-on }} completed in $(($(date +%s)-CI_JOB_STARTED_AT))s (timeout cap: 35m)"

